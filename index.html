<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuangXIW</title>
<style>
/* ─────────────────────────────────────────────────────────────
   GuangXIW · 关系网
   版面：顶栏一条 + 画布铺满 + 左右抽屉覆盖（不改画布尺寸，杜绝挤压）
   风格：档案纸感 —— 细线、字距、等宽数字；只有一个黄铜强调色
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme:dark;      /* 让原生日期选择器也跟着变暗，不再白方块 */
  --ink:#101317; --ink2:#14181d; --panel:#161a20; --raise:#1b2027; --raise2:#20262e;
  --hair:#242a32; --hair2:#313943;
  --fg:#d7d4cf; --fg2:#a7aab1; --fg3:#71767f;
  --brass:#c8a96a; --steel:#8aa2bd; --rust:#c47b62; --moss:#7e9c86;
  --sans:"Noto Sans SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--fg);
  font:14.5px/1.7 var(--sans);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:auto;text-shadow:0 0 .35px rgba(255,255,255,.14)}
body{background-image:radial-gradient(circle at 1px 1px,#22272e 1px,transparent 0);
  background-size:26px 26px;background-position:-1px -1px}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden}

/* ── 顶栏 ── */
#bar{position:absolute;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:linear-gradient(180deg,rgba(16,19,23,.97),rgba(16,19,23,.86));
  border-bottom:1px solid var(--hair);z-index:30}
#bar .sig{display:flex;align-items:center;gap:9px;flex:none}
#bar .sig svg{width:19px;height:19px;border-radius:4px}
#bar .sig b{font-weight:600;font-size:14.5px;letter-spacing:.02em}
#bar .sig b i{font-style:normal;color:var(--brass)}
#bar .case{display:flex;align-items:center;gap:8px;flex:none;
  padding-left:14px;border-left:1px solid var(--hair)}
#bar .case span{font:11px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);text-transform:uppercase}
select{background:var(--raise);border:1px solid var(--hair2);border-radius:5px;height:30px;
  padding:0 8px;outline:none;max-width:168px;transition:.15s}
select:hover{border-color:#3d4650}
#q{flex:1 1 auto;min-width:90px;max-width:280px;height:30px;background:var(--raise);
  border:1px solid var(--hair2);border-radius:5px;padding:0 10px;outline:none;transition:.15s}
#q:focus{border-color:var(--brass);background:var(--raise2)}
#bar .grow{flex:1}
.tb{height:30px;padding:0 11px;background:transparent;border:1px solid var(--hair2);border-radius:5px;
  font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;display:inline-flex;
  align-items:center;gap:6px}
.tb:hover{border-color:var(--brass);color:var(--brass)}
.tb:active{transform:translateY(1px)}
.tb.on{background:rgba(200,169,106,.12);border-color:var(--brass);color:var(--brass)}
.tb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.tb.icon{width:30px;padding:0;justify-content:center}

/* ── 画布 ── */
#stage{position:absolute;inset:56px 0 0 0}
svg#g{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
svg#g.pan{cursor:grabbing}
.e{stroke:#333c46;stroke-linecap:round;transition:stroke .15s,opacity .15s}
.e.hot{stroke:var(--brass)}
.e.path{stroke:var(--moss);stroke-width:3.2}
.e.dim{opacity:.14}
.n rect.body{fill:#181d23;stroke:#2b333d;transition:fill .15s,stroke .15s}
.n:hover rect.body{fill:#1e242c;stroke:#3a444f}
.n.sel rect.body{fill:#1f2630;stroke:var(--brass)}
.n.path rect.body{stroke:var(--moss)}
.n.dim{opacity:.22}
.n text{pointer-events:none;font-family:var(--sans)}
.n .nm{fill:#dcd9d3;font-size:13px}
.n .mt{fill:var(--fg3);font-size:10px;letter-spacing:.03em}
.n .bar{pointer-events:none}

/* ── 底部捕获条 ── */
#capture{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:8px;width:min(680px,calc(100% - 40px));
  background:rgba(22,26,32,.96);border:1px solid var(--hair2);border-radius:8px;padding:8px 10px;
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
#capture input{flex:1;background:transparent;border:0;outline:none;font-size:13.5px}
#capture input::placeholder{color:var(--fg3)}
#capture .sep{width:1px;height:20px;background:var(--hair2)}

/* ── 抽屉（左：清单 / 右：详情）── */
.drawer{position:absolute;top:56px;bottom:0;width:300px;z-index:25;display:flex;flex-direction:column;
  background:var(--panel);transition:transform .26s var(--ease);will-change:transform}
#left{left:0;border-right:1px solid var(--hair);transform:translateX(-100%);
  box-shadow:14px 0 30px rgba(0,0,0,.3)}
#left.open{transform:none}
#right{right:0;width:336px;border-left:1px solid var(--hair);transform:translateX(100%);
  box-shadow:-14px 0 30px rgba(0,0,0,.3)}
#right.open{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;
  border-bottom:1px solid var(--hair);font:11px/1 var(--mono);letter-spacing:.14em;
  color:var(--fg3);text-transform:uppercase;flex:none}
.drawer header .x{margin-left:auto}
.body{flex:1;overflow:auto;padding:12px}
.body::-webkit-scrollbar{width:8px}
.body::-webkit-scrollbar-thumb{background:#333b45;border-radius:6px;border:2px solid transparent;background-clip:padding-box}

/* 清单 */
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tab{flex:1;height:28px;border:1px solid var(--hair2);border-radius:5px;background:transparent;
  font-size:12.5px;color:var(--fg2);cursor:pointer;transition:.15s}
.tab.on{border-color:var(--brass);color:var(--brass);background:rgba(200,169,106,.1)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.chip{border:1px solid var(--hair2);border-radius:999px;padding:2px 9px;font-size:11.5px;
  color:var(--fg3);cursor:pointer;transition:.15s}
.chip:hover{color:var(--fg)}
.chip.on{border-color:var(--brass);color:var(--brass);background:rgba(200,169,106,.12)}
.row{display:flex;align-items:center;gap:9px;padding:7px 7px;border-radius:6px;cursor:pointer;
  transition:.13s;font-size:13px}
.row:hover{background:var(--raise)}
.row.sel{background:rgba(200,169,106,.12)}
.row .dot{width:6px;height:6px;border-radius:50%;flex:none}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dg{font:11px/1 var(--mono);color:var(--rust);flex:none}
.evday{font:10.5px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);margin:14px 2px 6px}
.evrow{display:flex;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.6}
.evrow:hover{background:var(--raise)}
.evrow .t{font:11px/1.5 var(--mono);color:var(--brass);flex:none;width:36px}
.evrow .w{color:var(--fg2);flex:none;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 详情表单 */
.sec{margin-bottom:14px}
.sec h5{margin:0 0 8px;font:10.5px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec h5::after{content:"";flex:1;height:1px;background:var(--hair)}
.f{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.f>label{width:42px;flex:none;font-size:11px;color:var(--fg3)}
input[type=text],input[type=search],textarea{width:100%;min-width:0;background:var(--raise);
  border:1px solid var(--hair2);border-radius:5px;height:30px;padding:0 9px;outline:none;transition:.15s}
textarea{height:auto;min-height:58px;padding:7px 9px;line-height:1.6;resize:vertical}
input:focus,textarea:focus{border-color:var(--brass);background:var(--raise2)}
.bt{height:30px;padding:0 11px;border-radius:5px;border:1px solid var(--hair2);background:var(--raise);
  font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.bt:hover{border-color:var(--brass);color:var(--brass)}
.bt.solid{background:rgba(200,169,106,.14);border-color:var(--brass);color:var(--brass)}
.bt.wide{width:100%}
.bt.danger{color:var(--rust);border-color:#3d2a26}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;background:var(--raise2);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--brass);
  border:1px solid var(--hair2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 6px;border-radius:5px;cursor:pointer}
.kv:hover{background:var(--raise)}
.kv .k{color:var(--fg3);min-width:52px}
.kv .v{flex:1;min-width:0;white-space:normal;word-break:break-word;line-height:1.5}
.rel{display:flex;align-items:center;gap:8px;padding:6px;border-radius:5px;font-size:12.5px;cursor:pointer}
.rel:hover{background:var(--raise)}
.rel .s{margin-left:auto;font:11px/1 var(--mono);color:var(--rust)}
.rel .ev{font:10.5px/1 var(--mono);color:var(--fg3)}
.empty{color:var(--fg3);font-size:12px;padding:8px 4px;line-height:1.8}
.foot{font:11px/1.7 var(--mono);color:var(--fg3);letter-spacing:.03em}
.foot b{color:var(--fg2);font-weight:500}

/* ── 对话框 / 提示 ── */
#veil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(9,11,14,.66)}
#veil.on{display:flex}
#box{width:min(430px,92vw);background:var(--panel);border:1px solid var(--hair2);border-radius:10px;
  padding:20px 22px;box-shadow:0 22px 60px rgba(0,0,0,.55)}
#box h4{margin:0 0 5px;font-size:15.5px;font-weight:600}
#box p{margin:0 0 13px;font-size:12.5px;color:var(--fg2);line-height:1.7}
#box .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
#bForm .f{margin-bottom:8px}
#bForm .f>label{width:38px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);z-index:70;
  background:var(--raise2);border:1px solid var(--brass);border-radius:7px;padding:8px 14px;
  font-size:12.5px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
  .evrow{display:flex;gap:8px;align-items:flex-start}
  .evops{display:flex;gap:4px;flex:none}
  .evop{font-size:11px;line-height:16px;padding:0 5px;border:1px solid var(--line2);border-radius:3px;
    color:var(--fg3);cursor:pointer;user-select:none;font-weight:400}
  .evop:hover{border-color:var(--brass2);color:var(--brass)}
  .evop.on{color:#0f1318;background:var(--brass);border-color:var(--brass)}
  .shotmark{font-size:10px;color:var(--brass);border:1px solid var(--brass2);border-radius:3px;padding:0 3px}
  .todorow{display:flex;gap:7px;align-items:flex-start}
  .todorow.done .todotxt{color:var(--fg3);text-decoration:line-through}
  .todobox{width:14px;height:14px;flex:none;margin-top:2px;border:1px solid var(--line2);border-radius:3px;
    font-size:11px;line-height:12px;text-align:center;cursor:pointer;color:var(--brass)}
  .todohow{display:block;font-size:11px;color:var(--fg3);margin-top:2px}
/* 待办标签 & 信息流标签 */
  .todolabel{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;font-size:11px;
    background:rgba(200,169,106,.16);color:var(--brass);border:1px solid rgba(200,169,106,.35)}
  .evtag{display:inline-block;margin-right:6px;padding:0 5px;border-radius:4px;font-size:10.5px;
    color:#9aa0a8;border:1px solid var(--hair2)}
  .evtag.lab{color:var(--brass);border-color:rgba(200,169,106,.35);background:rgba(200,169,106,.12)}
  .evtag.ok{color:#67c98b;border-color:rgba(103,201,139,.4)}
  .evtag.no{color:#e0716b;border-color:rgba(224,113,107,.4)}
  .evrow.istd{opacity:.95}
.relwrap{padding:0 0 6px}
  .rel{margin:0}
  .relnote{font-size:12px;line-height:1.6;color:var(--fg2);padding:3px 2px 6px;
    white-space:normal;word-break:break-word;border-bottom:1px dashed rgba(255,255,255,.07)}
  .f.col{display:block}
  .f.col label{display:block;margin-bottom:4px}
  .f textarea{width:100%;min-height:56px;resize:vertical;background:var(--bg2);
    border:1px solid var(--line2);border-radius:6px;color:var(--fg);
    font:13px/1.6 var(--sans);padding:6px 8px;outline:none}
  .f textarea:focus{border-color:var(--brass2)}
  .ovrow{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
  .ovrow:hover{background:rgba(255,255,255,.035)}
  .ovh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .ovn{font-size:13px;color:var(--fg);font-weight:600}
  .ovm{font-size:11px;color:var(--fg3)}
  .ovline{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--fg2)}
  .kvt{display:inline-flex;gap:4px;max-width:100%}
  .kvt i{font-style:normal;color:var(--fg3)}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="sig">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.2" fill="#c8a96a"/><circle cx="18" cy="10" r="2.6" fill="#8aa2bd"/>
        <circle cx="9" cy="19" r="2.6" fill="#8aa2bd"/><g stroke="#4a5561" stroke-width="1.4">
        <line x1="6" y1="6" x2="18" y2="10"/><line x1="6" y1="6" x2="9" y2="19"/><line x1="18" y1="10" x2="9" y2="19"/></g></svg>
      <b>Guang<i>XIW</i></b>
    </div>
    <div class="case">
      <span>case</span>
      <select id="folderSel"></select>
      <button class="tb icon" id="folderAdd" title="新建文件夹">+</button>
    </div>
    <input id="q" type="search" placeholder="搜人名 / 标签">
    <div class="grow"></div>
    <button class="tb" id="pathBtn" title="查两人之间的最短关系链">路径</button>
    <button class="tb" id="pathClear" title="清除关系链高亮" style="display:none">清除路径</button>
    <button class="tb" id="tidyBtn" title="把内容挪到画布正中">归整</button>
    <button class="tb icon" id="leftBtn" title="实体清单">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="tb icon" id="rightBtn" title="详情面板 (Ctrl+K)">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/></svg></button>
  </div>

  <div id="stage">
    <svg id="g"><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="capture">
      <input id="capInput" placeholder="速记：选中谁就记到谁名下（回车）">
      <div class="sep"></div>
      <button class="bt" id="addBtn">人物</button>
      <button class="bt solid" id="capBtn">记一笔</button>
    </div>
  </div>

  <aside class="drawer" id="left">
    <header><span>清单</span><button class="tb icon x" id="leftClose">×</button></header>
    <div class="tabs">
      <button class="tab on" id="tabList">实体</button>
      <button class="tab" id="tabFolder">文件夹</button>
      <button class="tab" id="tabOver">总览</button>
      <button class="tab" id="tabTodo">待办</button>
    </div>
    <div class="body" id="leftBody"></div>
  </aside>

  <aside class="drawer" id="right">
    <header><span>详情</span><button class="tb icon x" id="rightClose">×</button></header>
    <div class="body" id="rightBody"></div>
  </aside>

  <div id="veil"><div id="box">
    <h4 id="bTitle"></h4><p id="bDesc"></p>
    <input type="text" id="bInput"><textarea id="bArea"></textarea><div id="bForm"></div>
    <div class="acts"><button class="bt danger" id="bDel" style="margin-right:auto;display:none">删除</button>
      <button class="bt" id="bCancel">取消</button><button class="bt solid" id="bOk">保存</button></div>
  </div></div>
  <div id="toast"></div>
</div>
<input type="file" id="filePick" accept=".json,application/json" hidden>
<input type="file" id="shotPick" accept="image/*" style="display:none">
<input type="file" id="avPick" accept="image/*" hidden>
<script>
/* ═══════════════ 数据层 ═══════════════ */
const VERSION = "2.15.0";
const KEY = "guangxiw.v2";
const TYPES = [["person","人物"],["org","组织"],["place","地点"],["account","账号"],["other","其他"]];
const TYPE_LABEL = Object.fromEntries(TYPES);
const TYPE_COLOR = {person:"#c8a96a", org:"#8aa2bd", place:"#b99a6b", account:"#8ba0b5", other:"#8b9099"};
const RELS = ["亲属","同事","同学","好友","资金","同平台","其他"];
const NW = 168, NH = 60;

let folders = [], curId = null, selected = null;
let view = {x:0, y:0, k:1}, drag = null, pan = null, hover = null;
let pathN = new Set(), pathE = new Set();
let linking = null;   // 正在拖线：{from, x, y}
let filterType = null, tab = "list", layoutKind = "force";

const $ = id => document.getElementById(id);
const uid = p => p + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now = () => Date.now();
const fmtDate = ts => { if(!ts) return "—"; const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const fmtDateInput = ts => { const d = ts ? new Date(ts) : new Date(), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const parseDateInput = s => {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((s||"").trim());
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3], 12, 0);   // 用中午，避开时区/夏令时边界
  return isNaN(d.getTime()) ? null : d.getTime();
};
const fmt = ts => { if(!ts) return "—"; const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const data = () => folders.find(f => f.id === curId) || folders[0];

const mkNode = (name, type = "person") => ({ id:uid("n"), name, type, tags:[], accounts:[], attrs:[],
  events:[], avatar:"", x:0, y:0 });
const mkEdge = (from, to, type = "其他", strength = 3, note = "", evidence = "") =>
  ({ id:uid("e"), from, to, type, strength, note, evidence, grade: "", at: now() });

// 证据号：全库递增 E-001 / E-002 …（备注就是这条证据的正文）
const SRC_OPTS = ["A 完全可靠","B 一般可靠","C 不太可靠","D 不可靠","E 无法判断"];
const CRED_OPTS = ["1 已确认","2 大致可信","3 有可能","4 可疑","5 不太可能","6 无法判断"];
function nextEvidenceId(){
  let max = 0;
  folders.forEach(f => (f.edges||[]).forEach(e => {
    const m = /^E-(\d+)$/.exec((e.evidence||"").trim());
    if(m) max = Math.max(max, parseInt(m[1], 10));
  }));
  return "E-" + String(max + 1).padStart(3, "0");
}
// "B2" → 显示用
function gradeText(g){
  if(!g) return "";
  const s = SRC_OPTS.find(x => x[0] === g[0]);
  const c = CRED_OPTS.find(x => x[0] === g[1]);
  return (s ? s : g[0]) + " · " + (c ? c : g[1]);
}

function notifyBackup(){
  try{
    if(window.chrome && window.chrome.webview)
      window.chrome.webview.postMessage("BACKUP:" + JSON.stringify({ folders, cur:curId, v:VERSION, layout:layoutKind }));
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({ folders, cur:curId, v:VERSION, layout:layoutKind })); notifyBackup(); }
  catch(e){ toast("保存失败：头像过多"); }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.folders) && d.folders.length){ folders = d.folders; curId = d.cur || folders[0].id; }
      if(d.layout && ["force","circle","degree"].includes(d.layout)) layoutKind = d.layout;
    }
    if(!folders.length){
      // 从旧版本（v1）迁移，不丢用户已经录的关系
      const old = localStorage.getItem("guangxiw.v1");
      if(old){
        const d = JSON.parse(old);
        if(Array.isArray(d.folders) && d.folders.length){ folders = d.folders; curId = d.cur || folders[0].id; }
        else if(Array.isArray(d.cases) && d.cases.length){
          folders = d.cases.map(c => ({ id:c.id || uid("f"), name:c.name || "文件夹", nodes:c.nodes || [], edges:c.edges || [] }));
          curId = d.cur && folders.some(f=>f.id===d.cur) ? d.cur : folders[0].id;
        } else if(Array.isArray(d.nodes)){
          folders = [{ id:uid("f"), name:"默认文件夹", nodes:d.nodes, edges:d.edges || [] }];
          curId = folders[0].id;
        }
      }
    }
  }catch(e){}
  if(!folders.length){
    folders = [{ id:uid("f"), name:"默认文件夹", nodes:[], edges:[] }];
    curId = folders[0].id;
  }
  // 兼容旧字段
  folders.forEach(f => f.nodes.forEach(n => {
    if(!Array.isArray(n.events)) n.events = [];
    if(!Array.isArray(n.accounts)) n.accounts = [];
    if(!Array.isArray(n.attrs)) n.attrs = [];
    if(n.note && !n.events.length){ n.events.push({ at:0, text:n.note }); n.note = ""; }
  }));
}

function closeDlg(){ $("veil").classList.remove("on"); dlgCb = null; formCb = null; formDel = null;
  $("bForm").style.display = "none"; $("bForm").innerHTML = ""; }

$("veil").addEventListener("click", e => { if(e.target.id === "veil") closeDlg(); });
let formCb = null, formDel = null;
function dialogForm(title, desc, rows, values, onSubmit, onDelete){
  dlgMode = "form"; formCb = onSubmit; formDel = onDelete || null;
  $("bTitle").textContent = title; $("bDesc").textContent = desc || "";
  $("bInput").style.display = "none"; $("bArea").style.display = "none";
  const box = $("bForm"); box.style.display = "block";
  box.innerHTML = rows.map(r => {
    const v = esc((values && values[r.k]) || "");
    let field;
    if(r.type === "area") field = `<textarea data-f="${r.k}" placeholder="${esc(r.ph||"")}" style="min-height:64px">${v}</textarea>`;
    else if(r.type === "date") field = `<input type="text" data-f="${r.k}" value="${v}" placeholder="2026-10-22" inputmode="numeric">`;
    else if(r.type === "date") field = `<input type="text" data-f="${r.k}" value="${v}" placeholder="2026-10-22" inputmode="numeric">`;
    else if(r.type === "select") field = `<select data-f="${r.k}" style="width:100%">${(r.opts||[]).map(o =>
      `<option${o === ((values && values[r.k]) || "") ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else field = `<input type="text" data-f="${r.k}" placeholder="${esc(r.ph||"")}" value="${v}">`;

let toastT = null;

  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 2400);

/* ═══════════════ 布局 ═══════════════ */
function layout(kind){
  const d = data(), N = d.nodes, E = d.edges;
  if(!N.length) return;
  if(kind === "circle"){
    const R = Math.max(190, N.length * 25);
    N.forEach((n,i) => { const a = i/N.length*Math.PI*2 - Math.PI/2;
      n.x = Math.cos(a)*R; n.y = Math.sin(a)*R; });
    return;
  }
  if(kind === "degree"){
    const deg = {}; E.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
    const arr = [...N].sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0));
    const cols = Math.max(1, Math.ceil(Math.sqrt(arr.length)));
    arr.forEach((n,i) => { n.x = (i%cols)*270 - (cols-1)*135; n.y = Math.floor(i/cols)*150; });
    return;
  }
  N.forEach((n,i) => { const a = i/N.length*Math.PI*2, R = 120 + N.length*16;
    n.x = Math.cos(a)*R; n.y = Math.sin(a)*R; });
  const by = Object.fromEntries(N.map(n=>[n.id,n]));
  for(let it=0; it<300; it++){
    const fx = {}, fy = {};
    N.forEach(n => { fx[n.id]=0; fy[n.id]=0; });
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const a=N[i], b=N[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2 < 1){ dx = Math.random()-0.5; dy = Math.random()-0.5; d2 = 1; }
      const d = Math.sqrt(d2), f = 56000/d2, ux=dx/d, uy=dy/d;
      fx[a.id]-=ux*f; fy[a.id]-=uy*f; fx[b.id]+=ux*f; fy[b.id]+=uy*f;
    }
    E.forEach(e => {
      const a = by[e.from], b = by[e.to]; if(!a || !b) return;
      const s = e.strength || 3;
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy) || 1;
      const rest = 250 - s*15, k = 0.012*(1+s/6), p = (d-rest)*k, ux=dx/d, uy=dy/d;
      fx[a.id]+=ux*p; fy[a.id]+=uy*p; fx[b.id]-=ux*p; fy[b.id]-=uy*p;
    });
    N.forEach(n => { fx[n.id]-=n.x*0.008; fy[n.id]-=n.y*0.008; });
    N.forEach(n => { const lim = 30;
      n.x += Math.max(-lim, Math.min(lim, fx[n.id]));
      n.y += Math.max(-lim, Math.min(lim, fy[n.id])); });
  }
}

/* ═══════════════ 视图与绘制 ═══════════════ */
const svg = $("g"), vp = $("vp"), gE = $("edges"), gN = $("nodes");
function stageSize(){ const r = $("stage").getBoundingClientRect(); return { w:r.width, h:r.height }; }
function applyView(){
  const { w, h } = stageSize();
  vp.setAttribute("transform", `translate(${view.x + w/2},${view.y + h/2}) scale(${view.k})`);
}
function toWorld(cx, cy){
  const r = svg.getBoundingClientRect();
  return { x:(cx - r.left - view.x - r.width/2)/view.k, y:(cy - r.top - view.y - r.height/2)/view.k };
}
function center(move){
  const { w, h } = stageSize();
  if(!move){ view = { x:0, y:0, k:1 }; applyView(); return; }
  const N = data().nodes;
  if(!N.length){ view = { x:0, y:0, k:1 }; applyView(); return; }
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  N.forEach(n => { x1=Math.min(x1,n.x); x2=Math.max(x2,n.x); y1=Math.min(y1,n.y); y2=Math.max(y2,n.y); });
  view.x = -((x1+x2)/2); view.y = -((y1+y2)/2);
  applyView();
}
function focusNode(n){
  view.x = -n.x*view.k; view.y = -n.y*view.k;
  const el = vp; el.style.transition = "transform .24s " + "ease-out";
  applyView(); setTimeout(()=>{ el.style.transition = ""; }, 260);
}

function draw(){
  const d = data();
  const by = Object.fromEntries(d.nodes.map(n=>[n.id,n]));
  const deg = {}; d.edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
  const q = ($("q").value || "").trim().toLowerCase();
  const focusId = hover || selected;
  const near = new Set();
  if(focusId){
    near.add(focusId);
    d.edges.forEach(e => { if(e.from === focusId) near.add(e.to); if(e.to === focusId) near.add(e.from); });
  }
  const pathOn = pathN.size > 0;

  const visible = new Set(d.nodes.filter(n => !filterType || n.type === filterType).map(n => n.id));
  gE.innerHTML = d.edges.map(e => {
    const a = by[e.from], b = by[e.to]; if(!a || !b) return "";
    if(!visible.has(e.from) || !visible.has(e.to)) return "";   // 端点被筛掉，线也别画
    const onPath = pathE.has(e.id);
    const hot = onPath || e.from === focusId || e.to === focusId;
    const dim = (!!focusId && !hot) || (pathOn && !onPath);
    const w = 1 + (e.strength || 3) * 0.5;
    return `<line class="e${onPath ? " path" : (hot ? " hot" : "")}${dim ? " dim" : ""}" data-e="${e.id}"
      x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${onPath ? 3.2 : w}">
      <title>${esc(a.name)} — ${esc(e.type)} — ${esc(b.name)}｜强度 ${e.strength||3}${e.evidence ? "｜"+esc(e.evidence) : ""}</title></line>`;
  }).join("");

  if(linking){
    const a = d.nodes.find(n => n.id === linking.from);
    if(a){
      gE.innerHTML += `<line id="linkLine" x1="${a.x}" y1="${a.y}" x2="${linking.x}" y2="${linking.y}"
        stroke="#c8a96a" stroke-width="2" stroke-dasharray="6 5" opacity=".9"/>`;
    }
  }
  gN.innerHTML = d.nodes.map(n => {
    if(filterType && n.type !== filterType) return "";
    const hit = q && (n.name.toLowerCase().includes(q) || (n.tags||[]).join(",").toLowerCase().includes(q));
    const sel = selected === n.id, onPath = pathN.has(n.id);
    const dim = (focusId && !near.has(n.id)) || (pathOn && !onPath);
    const color = TYPE_COLOR[n.type] || TYPE_COLOR.other;
    const L = -NW/2, T = -NH/2;
    const av = n.avatar
      ? `<image href="${n.avatar}" x="${L+12}" y="${T+12}" width="36" height="36" clip-path="inset(0 round 18px)"/>`
      : `<circle cx="${L+30}" cy="${T+30}" r="18" fill="${color}22" stroke="${color}55"/>
         <text x="${L+30}" y="${T+30}" text-anchor="middle" dominant-baseline="central"
           font-size="15" fill="${color}" style="font-family:var(--sans)">${esc((n.name||"?").slice(0,1))}</text>`;
    const sub = [TYPE_LABEL[n.type] || n.type, (n.accounts||[]).length ? (n.accounts.length+" 号") : "",
                 deg[n.id] ? (deg[n.id]+" 关系") : ""].filter(Boolean).join(" · ");
    return `<g class="n${sel ? " sel" : ""}${onPath ? " path" : ""}${dim ? " dim" : ""}"
      data-n="${n.id}" transform="translate(${n.x},${n.y})">
      <rect class="body" x="${L}" y="${T}" width="${NW}" height="${NH}" rx="10"/>
      <rect class="bar" x="${L}" y="${T}" width="2.5" height="${NH}" rx="1" fill="${color}"/>
      ${av}
      <text class="nm" x="${L+58}" y="${T+27}">${esc(n.name.slice(0,9))}</text>
      <text class="mt" x="${L+58}" y="${T+44}">${esc(sub)}</text>
      ${hit ? `<rect x="${L-3}" y="${T-3}" width="${NW+6}" height="${NH+6}" rx="13" fill="none"
        stroke="#c47b62" stroke-width="1.2"/>` : ""}
    </g>`;
  }).join("");

  const pc = $("pathClear");
  if(pc) pc.style.display = pathN.size ? "inline-flex" : "none";
  applyView();
  drawLeft();
  drawRight();
}

/* ═══════════════ 左抽屉 ═══════════════ */
function drawLeft(){
  const d = data(), box = $("leftBody");
  ["tabList","tabFolder","tabOver","tabTodo"].forEach(id => $(id).classList.toggle("on", id === "tab"+tab[0].toUpperCase()+tab.slice(1)));

  if(tab === "list"){
    const deg = {}; d.edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
    const q = ($("q").value || "").trim().toLowerCase();
    const list = d.nodes.filter(n => {
      if(filterType && n.type !== filterType) return false;
      if(!q) return true;
      return n.name.toLowerCase().includes(q) || (n.tags||[]).join(",").toLowerCase().includes(q);
    }).sort((a,b) => (deg[b.id]||0)-(deg[a.id]||0));
    box.innerHTML = `
      <div class="chips">${["","person","org","place","account","other"].map(t =>
        `<span class="chip${filterType === (t||null) ? " on" : ""}" data-t="${t}">${t ? TYPE_LABEL[t] : "全部"}</span>`).join("")}</div>
      <div class="foot" style="margin:6px 2px 4px">${list.length} / ${d.nodes.length} 个实体 · ${d.edges.length} 条关系</div>
      ${list.length ? list.map(n => `<div class="row${selected===n.id?" sel":""}" data-jump="${n.id}">
        <span class="dot" style="background:${TYPE_COLOR[n.type]||TYPE_COLOR.other}"></span>
        <span class="nm">${esc(n.name)}</span><span class="dg">${deg[n.id]||0}</span></div>`).join("")
        : `<div class="empty">${d.nodes.length ? "这个分类下还没有实体。" : "还没有实体。画布上双击空白处，或点底部「人物」。"}</div>`}`;
    box.querySelectorAll(".chip").forEach(el => el.onclick = () => { filterType = el.dataset.t || null; draw(); });
    box.querySelectorAll("[data-jump]").forEach(el => el.onclick = () => {
      selected = el.dataset.jump; openDrawer("right"); draw();
      const n = data().nodes.find(x => x.id === selected); if(n) focusNode(n);
    });
    return;
  }

  if(tab === "todo"){
    // 所有实体的待办汇总：未完成在前，按时间倒序
    const items = [];
    d.nodes.forEach(nd => (nd.todos||[]).forEach((td, idx) => items.push({ nd, td, idx })));
    if(!items.length){ box.innerHTML = `<div class="empty">还没有待办。选中一个人，在详情里加。</div>`; return; }
    items.sort((a,b) => (a.td.done?1:0)-(b.td.done?1:0) || (b.td.at||0)-(a.td.at||0));
    let html = "";
    items.forEach(it => {
      const td = it.td;
      html += `<div class="kv todorow${td.done?" done":""}" data-tk="${it.nd.id}" data-ti="${it.idx}">
        <b class="todobox" data-tact="done" title="标记完成">${td.done?"✓":""}</b>
        <span class="v">${td.label?`<span class="todolabel">${esc(td.label)}</span>`:""}<span class="todotxt">${esc(td.text)}</span>
          <span class="todohow">${esc(it.nd.name)}${td.at?` · ${fmtDate(td.at)}`:""}</span></span>
        <b class="evop" data-tact="edit" title="编辑">改</b>
        <b class="evop" data-tact="del" title="删除">×</b>
      </div>`;
    });
    box.innerHTML = html;
    box.querySelectorAll("[data-tk]").forEach(row => {
      const nid = row.dataset.tk, idx = +row.dataset.ti;
      const nd = d.nodes.find(x => x.id === nid);
      const td = nd && (nd.todos||[])[idx];
      if(!td) return;
      row.querySelectorAll("[data-tact]").forEach(b => b.onclick = ev => {
        ev.stopPropagation();
        const act = b.dataset.tact;
        if(act === "done"){ td.done = !td.done; save(); draw(); }
        else if(act === "del"){ nd.todos.splice(idx,1); save(); draw(); toast("已删除待办"); }
        else if(act === "edit"){
          dialogForm("编辑待办", "标签 + 要做的事情，随时可以改。",
            [{k:"label",label:"标签",ph:"待核实 / 待截图"},{k:"text",label:"要做的事",type:"area",ph:"具体做什么"}],
            { label: td.label || "", text: td.text || "" },
            v => {
              if(!(v.text||"").trim()) return toast("要做的事不能空");
              td.label = (v.label||"").trim(); td.text = v.text.trim();
              save(); draw(); toast("已保存");
            },
            () => { nd.todos.splice(idx,1); save(); draw(); toast("已删除待办"); });
        }
      });
      row.onclick = () => { selected = nid; openDrawer("right"); draw(); };
    });
    return;
  }

  if(tab === "over"){
    // 一屏看完：标签 / 账号 / 其他信息 / 关系数 / 记录数 / 未完成待办
    if(!d.nodes.length){ box.innerHTML = `<div class="empty">还没有实体。</div>`; return; }
    let html = "";
    d.nodes.forEach(nd => {
      const deg = d.edges.filter(e => e.from === nd.id || e.to === nd.id).length;
      const typeLabel = (TYPES.find(x => x[0] === nd.type) || [null, nd.type || ""])[1];
      const tags = (nd.tags || []).map(x => `<span class="evtag lab">${esc(x)}</span>`).join("");
      const accs = (nd.accounts || []).map(a => `<span class="kvt"><i>${esc(a.platform)}</i>${esc(a.handle)}</span>`).join("");
      const attrs = (nd.attrs || []).map(a => `<span class="kvt"><i>${esc(a.k)}</i>${esc(a.v)}</span>`).join("");
      const openTodo = (nd.todos || []).filter(x => !x.done).length;
      const evCount = (nd.events || []).length;
      html += `<div class="ovrow" data-ov="${nd.id}">
        <div class="ovh"><span class="ovn">${esc(nd.name)}</span>
          <span class="ovm">${esc(typeLabel)} · ${deg} 关系 · ${evCount} 记录${openTodo ? ` · ${openTodo} 待办` : ""}</span></div>
        ${tags ? `<div class="ovline">${tags}</div>` : ""}
        ${accs ? `<div class="ovline">${accs}</div>` : ""}
        ${attrs ? `<div class="ovline">${attrs}</div>` : ""}
      </div>`;
    });
    box.innerHTML = html;
    box.querySelectorAll("[data-ov]").forEach(el => el.onclick = () => {
      selected = el.dataset.ov; openDrawer("right"); draw();
    });
    return;
  }

  box.innerHTML = `
    <div class="sec"><h5>当前文件夹</h5>
      <div class="f"><input type="text" id="fName" value="${esc(d.name)}"></div>
      <div class="f"><button class="bt" id="fRename" style="flex:1">重命名</button>
      <button class="bt danger" id="fDel">删除</button></div>
      <div class="foot">${d.nodes.length} 实体 · ${d.edges.length} 关系</div>
    </div>
    <div class="sec"><h5>布局</h5>
      <div class="f"><select id="laySel" style="width:100%">
        <option value="force">力导向</option><option value="circle">环形</option><option value="degree">按连接数</option>
      </select></div>
    </div>
    <div class="sec"><h5>导入</h5>
      <button class="bt wide" id="impJson" style="margin-bottom:7px">导入 GuangXIW JSON</button>
    </div>
    <div class="sec"><h5>导出</h5>
      <button class="bt wide" id="expJson" style="margin-bottom:7px">JSON 备份</button>
      <button class="bt wide" id="expMd" style="margin-bottom:7px">Markdown 报告</button>
    </div>
    <div class="sec"><h5>关于</h5>
      <div class="foot"><b>GuangXIW ${VERSION}</b><br>SJ Lens 电脑端 / 手机端互通辅助工具<br>数据保存在本机</div>
    </div>`;

  const laySel = $("laySel");
  laySel.value = layoutKind;
  laySel.onchange = () => { layoutKind = laySel.value; layout(layoutKind); save(); draw(); center(true); };
  const nameInput = $("fName");
  if(nameInput) nameInput.addEventListener("change", () => {
    const v = (nameInput.value || "").trim();
    if(!v || v === d.name) return;
    d.name = v; save(); refreshFolders(); toast("已重命名");
  });
  $("fRename").onclick = () => dialog("text", "文件夹名称", "", "名称", d.name, v => {
    if(!v) return; d.name = v.trim(); save(); refreshFolders(); draw(); toast("已重命名");
  });
  $("fDel").onclick = () => {
    if(folders.length <= 1) return toast("至少保留一个文件夹");
    dialog("text", "删除文件夹？", `「${d.name}」里的 ${d.nodes.length} 个实体会一起删除。`, "输入 yes 确认", "", v => {
      if((v||"").trim().toLowerCase() !== "yes") return toast("已取消");
      folders = folders.filter(f => f.id !== d.id); curId = folders[0].id;
      selected = null; save(); refreshFolders(); layout(layoutKind); draw(); center(true); toast("已删除");
    });
  };
  $("impJson").onclick = () => pick(f => importOwn(f));
$("expJson").onclick = () => exportJson();
  $("expMd").onclick = () => exportMd();
}


/* ── 记录/待办渲染 ── */
const EV_ST = { ok:["已证实","#5fae7a"], no:["已推翻","#c96a5f"], "":["待验证","#8b98a6"] };
function evRows(n){
  const list = (n.events||[]).map((ev,i) => ({ev, i})).sort((a,b) => (b.ev.at||0)-(a.ev.at||0));
  if(!list.length) return `<div class="empty" style="padding:2px 4px">还没有记录。</div>`;
  return list.map(({ev,i}) => {
    const st = EV_ST[ev.st || ""] || EV_ST[""];
    return `<div class="kv evrow" data-evrow="${i}">
      <span class="k">${fmtDate(ev.at)}</span>
      <span class="v">${esc(ev.text)}${ev.shot ? ` <span class="shotmark" title="有截图">图</span>` : ""}</span>
      <span class="evops">
        <b class="evop${ev.st==="ok"?" on":""}" data-evi="${i}" data-act="ok" title="证实">证</b>
        <b class="evop${ev.st==="no"?" on":""}" data-evi="${i}" data-act="no" title="推翻">翻</b>
        <b class="evop" data-evi="${i}" data-act="shot" title="${ev.shot ? "打开截图" : "附截图"}">${ev.shot ? "看" : "图"}</b>
      </span>
    </div>`;
  }).join("");
}
function todoRows(n){
  const list = n.todos || [];
  if(!list.length) return `<div class="empty" style="padding:2px 4px">还没有待办。比如「确认是否同一人」/「留存主页截图」。</div>`;
  return list.map((td,i) => `<div class="kv todorow${td.done?" done":""}">
    <b class="todobox" data-todo="${i}" data-act="done" title="标记完成">${td.done?"✓":""}</b>
    <span class="v">${td.label?`<span class="todolabel">${esc(td.label)}</span>`:""}<span class="todotxt">${esc(td.text)}</span>${td.how?`<span class="todohow">手段：${esc(td.how)}</span>`:""}</span>
    <b class="evop" data-todo="${i}" data-act="edit" title="编辑">改</b>
    <b class="evop" data-todo="${i}" data-act="del" title="删除">×</b>
  </div>`).join("");
}
/* ═══════════════ 右抽屉 ═══════════════ */
function drawRight(){
  const box = $("rightBody"), d = data();
  const n = d.nodes.find(x => x.id === selected);
  if(!n){
    box.innerHTML = `<div class="empty">未选中实体。<br>点画布上的卡片，或左侧清单里的人。</div>`;
    return;
  }
  const rels = d.edges.filter(e => e.from === n.id || e.to === n.id);
  box.innerHTML = `
    <div class="sec"><h5>${esc(TYPE_LABEL[n.type] || n.type)}</h5>
      <div class="f">

        <button class="bt" id="avBtn" style="flex:1">${n.avatar ? "更换头像" : "上传头像"}</button>
        ${n.avatar ? `<button class="bt" id="avDel">移除</button>` : ""}
      </div>
      <div class="f"><label>名字</label><input type="text" id="nName" value="${esc(n.name)}"></div>
      <div class="f"><label>类型</label><select id="nType" style="width:100%">${(() => {
        const cur = TYPE_LABEL[n.type] || n.type;
        const opts = TYPES.map(([v,l]) => l);
        if(!opts.includes(cur)) opts.push(cur);   // 自定义类型原样保留，避免保存时被改掉
        return opts.map(l => `<option${l === cur ? " selected" : ""}>${esc(l)}</option>`).join("");
      })()}</select></div>
      <div class="f"><label>标签</label><input type="text" id="nTags" value="${esc((n.tags||[]).join(","))}" placeholder="逗号分隔"></div>
      <button class="bt solid wide" id="nSave">保存</button>
    </div>

    <div class="sec"><h5>账号 <span style="color:var(--fg3)">${(n.accounts||[]).length}</span></h5>
      <div id="accList">${(n.accounts||[]).map((a,i) => `<div class="kv" data-acc="${i}">
        <span class="k">${esc(a.platform||"平台")}</span><span class="v">${esc(a.handle||"")}${a.note ? " · "+esc(a.note) : ""}</span>
        </div>`).join("") || `<div class="empty" style="padding:2px 4px">还没记账号。</div>`}</div>
      <div class="f" style="margin-top:7px"><select id="accP" style="width:100%">
        ${["抖音","快手","B站","小红书","微博","QQ","微信","其他"].map(x=>`<option>${x}</option>`).join("")}</select></div>
      <div class="f"><input type="text" id="accH" placeholder="账号 / 昵称"><button class="bt" id="accAdd">加</button></div>
    </div>

    <div class="sec"><h5>其他信息</h5>
      <div id="attrList">${(n.attrs||[]).map((a,i) => `<div class="kv" data-attr="${i}">
        <span class="k">${esc(a.k)}</span><span class="v">${esc(a.v)}</span></div>`).join("") || `<div class="empty" style="padding:2px 4px">还没有，比如：常去 / 喜好 / 车牌。</div>`}</div>
      <div class="f" style="margin-top:7px"><input type="text" id="atK" placeholder="项目">
        <input type="text" id="atV" placeholder="内容"><button class="bt" id="atAdd">加</button></div>
    </div>

    <div class="sec"><h5>记录 <span style="color:var(--fg3)">${(n.events||[]).length}</span></h5>
      <div id="evList">${evRows(n)}</div>
      <div class="f" style="margin-top:7px"><input type="text" id="evIn" placeholder="这条线索是什么"><button class="bt" id="evAdd">记</button></div>
      <div class="f"><label>日期</label><input type="text" id="evAt" inputmode="numeric"
        title="默认今天，可改成事情发生的日期，格式 2026-10-22"></div>
    </div>

    <div class="sec"><h5>待办 <span style="color:var(--fg3)">${(n.todos||[]).filter(x=>!x.done).length}/${(n.todos||[]).length}</span></h5>
      <div id="todoList">${todoRows(n)}</div>
      <div class="f" style="margin-top:7px"><input type="text" id="tdLabel" placeholder="标签，如：待核实 / 待截图"></div>
      <div class="f"><input type="text" id="tdText" placeholder="要做的事情"><button class="bt" id="tdAdd">加</button></div>
    </div>

    <div class="sec"><h5>建立关系</h5>
      <div class="f"><label>对方</label><input type="text" id="rTo" placeholder="名字，不存在会新建"></div>
      ${d.nodes.filter(x=>x.id!==n.id).length ? `<div class="chips" id="peerChips">${
        d.nodes.filter(x=>x.id!==n.id).slice(0,8).map(x =>
          `<span class="chip" data-peer="${esc(x.name)}">${esc(x.name)}</span>`).join("")}</div>` : ""}
      <div class="f"><label>类型</label><select id="rType" style="width:100%">${RELS.map(r=>`<option>${r}</option>`).join("")}</select></div>
      <div class="chips" id="rChips">${[1,2,3,4,5].map(s=>`<span class="chip${s===3?" on":""}" data-s="${s}">强度 ${s}</span>`).join("")}</div>
      <div class="f"><label>来源</label><select id="rSrc" style="width:100%">${SRC_OPTS.map(s=>`<option>${s}</option>`).join("")}</select></div>
      <div class="f"><label>可信度</label><select id="rCred" style="width:100%">${CRED_OPTS.map(s=>`<option>${s}</option>`).join("")}</select></div>
      <div class="f col"><label>备注（=证据）</label><textarea id="rNote" rows="3" placeholder="怎么认识的 / 谁说的 / 亲眼见过什么（写清楚，它会被当成这条关系的证据）"></textarea></div>
      <button class="bt solid wide" id="rAdd">建立关系</button>
    </div>

    <div class="sec"><h5>已有关联 <span style="color:var(--fg3)">${rels.length}</span>
      ${rels.some(e => !e.evidence) ? `<button class="bt" id="backfillEv" style="float:right;font-size:11px;padding:1px 7px">补齐证据号</button>` : ""}</h5>
      ${rels.length ? rels.map(e => {
        const o = d.nodes.find(x => x.id === (e.from === n.id ? e.to : e.from));
        return `<div class="relwrap" data-rel="${e.id}">
          <div class="rel"><span>${esc(o ? o.name : "?")}</span>
            <span style="color:var(--fg3)">${esc(e.type)}</span>
            <span class="ev" title="${esc(gradeText(e.grade))}">${esc(e.evidence || "未登记")}${e.grade ? ` ${esc(e.grade)}` : ""}</span>
            <span class="s">${e.strength || 3}</span></div>
          ${e.note ? `<div class="relnote">${esc(e.note)}</div>` : ""}</div>`;
      }).join("") : `<div class="empty" style="padding:2px 4px">还没有关系。</div>`}
    </div>

    <button class="bt danger wide" id="nDel">删除这个实体</button>`;

  const peerBox = box.querySelector("#peerChips");
  if(peerBox) peerBox.querySelectorAll("[data-peer]").forEach(ch => ch.onclick = () => {
    $("rTo").value = ch.dataset.peer;
    peerBox.querySelectorAll("[data-peer]").forEach(x => x.classList.toggle("on", x === ch));
  });
  let strength = 3;
  box.querySelectorAll("#rChips .chip").forEach(c => c.onclick = () => {
    strength = +c.dataset.s;
    box.querySelectorAll("#rChips .chip").forEach(x => x.classList.toggle("on", x === c));
  });
  $("avBtn").onclick = () => { avatarFor = n.id; $("avPick").value = ""; $("avPick").click(); };
  if($("avDel")) $("avDel").onclick = () => { n.avatar = ""; save(); draw(); };
  $("nSave").onclick = () => {
    n.name = ($("nName").value || "").trim() || n.name;
    const ty = ($("nType").value || "").trim();
    const known = TYPES.find(([v,l]) => l === ty);
    n.type = known ? known[0] : (ty || "other");
    n.tags = ($("nTags").value || "").split(",").map(s => s.trim()).filter(Boolean);
    save(); draw(); toast("已保存");
  };
  $("accAdd").onclick = () => {
    const p = ($("accP").value || "").trim(), h = ($("accH").value || "").trim();
    if(!h) return toast("填个账号");
    n.accounts = n.accounts || []; n.accounts.push({ platform:p || "其他", handle:h, note:"" });
    save(); draw(); toast("已添加账号");
  };
  $("atAdd").onclick = () => {
    const k = ($("atK").value || "").trim(), v = ($("atV").value || "").trim();
    if(!k || !v) return toast("项目和内容都要填");
    n.attrs = n.attrs || []; n.attrs.push({ k, v });
    save(); draw(); toast("已添加");
  };
  const evAt = $("evAt");
  if(evAt) evAt.value = fmtDateInput(now());
  const addEv = () => {
    const v = ($("evIn").value || "").trim(); if(!v) return;
    let at = now();
    if(evAt && evAt.value.trim()){
      const ts = parseDateInput(evAt.value);
      if(ts === null) return toast("日期格式要写成 2026-10-22");
      at = new Date(ts).getHours() === 12 ? (function(){
        const d = new Date(ts); d.setHours(new Date().getHours(), new Date().getMinutes()); return d.getTime();
      })() : ts;
    }
    n.events = n.events || []; n.events.push({ at, text: v });
    save(); draw();
    toast(at < now() - 60000 ? "已补录（" + fmtDate(at) + "）" : "已记录");
  };
  $("evAdd").onclick = addEv;
  $("evIn").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); addEv(); } });
  // 待办：标签 + 要做的事（原先绑定错放在文件夹分支，导致按钮没反应）
  const tdAddBtn = $("tdAdd");
  if(tdAddBtn){
    const addTodo = () => {
      const txt = ($("tdText").value || "").trim(); if(!txt) return;
      const labEl = $("tdLabel");
      const lab = labEl ? (labEl.value || "").trim() : "";
      n.todos = n.todos || [];
      n.todos.push({ id:uid("td"), label:lab, text:txt, at:now(), done:false });
      if(labEl) labEl.value = "";
      save(); draw(); toast("已加待办");
    };
    tdAddBtn.onclick = addTodo;
    const tdTextEl = $("tdText");
    if(tdTextEl) tdTextEl.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); addTodo(); } });
  }
  // 待办行：勾完成 / 删除 / 编辑（之前这段绑在文件夹分支，所以点了没反应）
  box.querySelectorAll("[data-todo]").forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      const i = +el.dataset.todo, act = el.dataset.act;
      n.todos = n.todos || [];
      if(!n.todos[i]) return;
      if(act === "done"){ n.todos[i].done = !n.todos[i].done; save(); draw(); }
      else if(act === "del"){ n.todos.splice(i,1); save(); draw(); toast("已删除待办"); }
      else if(act === "edit"){
        const td = n.todos[i];
        dialogForm("编辑待办", "标签 + 要做的事情，随时可以改。",
          [{k:"label",label:"标签",ph:"待核实 / 待截图"},{k:"text",label:"要做的事",type:"area",ph:"具体做什么"}],
          { label: td.label || "", text: td.text || "" },
          v => {
            if(!(v.text||"").trim()) return toast("要做的事不能空");
            td.label = (v.label||"").trim(); td.text = v.text.trim();
            save(); draw(); toast("已保存");
          },
          () => { n.todos.splice(i,1); save(); draw(); toast("已删除待办"); });
      }
    };
  });
  box.querySelectorAll("[data-acc]").forEach(el => el.onclick = () => {
    const i = +el.dataset.acc, a = n.accounts[i]; if(!a) return;
    dialogForm("编辑账号", "改完点保存；不需要了可以直接删除。",
      [{k:"platform",label:"平台",ph:"抖音 / 快手 / B站…"},{k:"handle",label:"账号",ph:"昵称或 ID"},
       {k:"note",label:"备注",ph:"比如：小号 / 已注销"}],
      { platform:a.platform, handle:a.handle, note:a.note },
      v => {
        if(!(v.handle||"").trim()) return toast("账号不能为空");
        n.accounts[i] = { platform:(v.platform||"").trim() || "其他", handle:v.handle.trim(), note:(v.note||"").trim() };
        save(); draw(); toast("已保存");
      },
      () => { n.accounts.splice(i,1); save(); draw(); toast("已删除"); });
  });
  box.querySelectorAll("[data-attr]").forEach(el => el.onclick = () => {
    const i = +el.dataset.attr, a = n.attrs[i]; if(!a) return;
    dialogForm("编辑信息", "键值对，比如 常去 / 喜好 / 车牌。",
      [{k:"k",label:"项目",ph:"常去"},{k:"v",label:"内容",ph:"XX 健身房"}],
      { k:a.k, v:a.v },
      x => {
        if(!(x.k||"").trim() || !(x.v||"").trim()) return toast("项目和内容都要填");
        n.attrs[i] = { k:x.k.trim(), v:x.v.trim() };
        save(); draw(); toast("已保存");
      },
      () => { n.attrs.splice(i,1); save(); draw(); toast("已删除"); });
  });
  // 行内三个小按钮（证 / 翻 / 看）必须先于行点击处理，否则会被「编辑记录」吞掉
  box.querySelectorAll("[data-evi]").forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    const i = +el.dataset.evi, act = el.dataset.act;
    n.events = n.events || [];
    const e = n.events[i]; if(!e) return;
    if(act === "ok") e.st = e.st === "ok" ? "" : "ok";
    else if(act === "no") e.st = e.st === "no" ? "" : "no";
    else if(act === "shot"){
      if(e.shot){
        if(e.shot.startsWith("data:")) window.open(e.shot, "_blank");
        else if(window.chrome && window.chrome.webview) window.chrome.webview.postMessage("openPath:" + e.shot);
        else toast("截图在：" + e.shot);
      } else {
        evShotFor = { nodeId:n.id, idx:i }; $("shotPick").value = ""; $("shotPick").click();
      }
    }
    save(); drawRight();
  });
  box.querySelectorAll("[data-evrow]").forEach(el => el.onclick = ev => {
    if(ev.target && ev.target.closest && ev.target.closest(".evop")) return;   // 交给上面的按钮处理
    const i = +el.dataset.evrow;
    const item = (n.events || [])[i]; if(!item) return;
    dialogForm("编辑记录", "日期可以改：补录昨天的事就写成昨天，格式 2026-10-22。",
      [{k:"at",label:"日期"},
       {k:"text",label:"内容",type:"area",ph:"这条线索是什么"}],
      { at:fmtDateInput(item.at), text:item.text },
      x => {
        if(!(x.text||"").trim()) return toast("内容不能为空");
        const ts = parseDateInput(x.at);
        if(ts !== null) item.at = ts;
        else if((x.at||"").trim()) return toast("日期格式要写成 2026-10-22");
        item.text = x.text.trim(); save(); draw(); toast("已保存");
      },
      () => { n.events = n.events.filter(y => y !== item); save(); draw(); toast("已删除"); });
  });
  let busy = false;
  const addRel = () => {
    if(busy) return; busy = true; setTimeout(() => busy = false, 500);
    const name = ($("rTo").value || "").trim().replace(/\s+/g, " ");
    if(!name) return toast("先填对方名字");
    if(name === n.name) return toast("不能和自己建立关系");
    let other = d.nodes.find(x => x.id !== n.id && x.name.trim() === name);
    if(!other){ other = mkNode(name); d.nodes.push(other); }
    const type = $("rType").value, note = ($("rNote").value||"").trim();
    const srcEl = $("rSrc"), credEl = $("rCred");
    const grade = (srcEl ? srcEl.value[0] : "C") + (credEl ? credEl.value[0] : "3");
    const ev = nextEvidenceId();
    const dup = d.edges.find(e => (e.from===n.id&&e.to===other.id)||(e.from===other.id&&e.to===n.id));
    if(dup){ dup.type = type; dup.strength = strength;
      if(note) dup.note = note;
      if(!dup.evidence) dup.evidence = ev;
      dup.grade = grade; toast("关系已更新"); }
    else { const e2 = mkEdge(n.id, other.id, type, strength, note, ev); e2.grade = grade;
      d.edges.push(e2); toast("已建立关系，" + ev); }
    save(); layout(layoutKind); draw(); center(true);
  };
  $("rAdd").onclick = addRel;
  ["rTo"].forEach(id => $(id).addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); addRel(); } }));
  box.querySelectorAll("[data-rel]").forEach(el => el.onclick = () => {
    const id = el.dataset.rel, e0 = d.edges.find(x => x.id === id); if(!e0) return;
    const other = d.nodes.find(x => x.id === (e0.from === n.id ? e0.to : e0.from));
    dialogForm("编辑关系", `与「${other ? other.name : "?"}」的关系 · ${e0.evidence || "未登记证据"}`,
      [{k:"type",label:"类型",type:"select",opts:RELS},
       {k:"strength",label:"强度",ph:"1-5"},
       {k:"note",label:"备注（=证据）",type:"area",ph:"怎么认识的 / 谁说的 / 亲眼见过什么"},
       {k:"src",label:"来源可靠性",type:"select",opts:SRC_OPTS},
       {k:"cred",label:"情报可信度",type:"select",opts:CRED_OPTS}],
      { type:e0.type, strength:String(e0.strength||3), note:e0.note||"",
        src: (SRC_OPTS.find(x => x[0] === (e0.grade||"")[0]) || SRC_OPTS[2]),
        cred: (CRED_OPTS.find(x => x[0] === (e0.grade||"")[1]) || CRED_OPTS[2]) },
      v => {
        e0.type = v.type || e0.type;
        e0.strength = Math.min(5, Math.max(1, parseInt(v.strength,10) || 3));
        e0.note = (v.note||"").trim();
        e0.grade = (v.src||"C")[0] + (v.cred||"3")[0];
        if(!e0.evidence) e0.evidence = nextEvidenceId();
        save(); draw(); toast("关系已更新");
      },
      () => { d.edges = d.edges.filter(x => x.id !== id); save(); draw(); toast("已删除关系"); });
  });
  const backfill = $("backfillEv");
  if(backfill) backfill.onclick = () => {
    let cnt = 0;
    d.edges.forEach(e => {
      if(e.evidence) return;
      e.evidence = nextEvidenceId();   // 发号后 nextEvidenceId 会跳过它，不会重号
      if(!e.grade) e.grade = "C3";
      if(!(e.note||"").trim()) e.note = "历史关联，待补备注";
      cnt++;
    });
    save(); draw(); toast(cnt ? `已补齐 ${cnt} 条关系的证据号` : "没有需要补的");
  };
  $("nDel").onclick = () => dialog("text", "删除这个实体？", "相连的关系会一起删除。", "输入 yes 确认", "", v => {
    if((v||"").trim().toLowerCase() !== "yes") return;
    d.nodes = d.nodes.filter(x => x.id !== n.id);
    d.edges = d.edges.filter(e => e.from !== n.id && e.to !== n.id);
    selected = null; save(); draw(); toast("已删除");
  });
}

/* ═══════════════ 交互 ═══════════════ */
svg.addEventListener("contextmenu", e => e.preventDefault());
svg.addEventListener("pointerdown", e => {
  e.preventDefault();
  const el = e.target.closest("[data-n]");
  // Shift + 拖节点 = 拉一条线到另一个节点上建立关系
  if(el && e.shiftKey){
    const n = data().nodes.find(x => x.id === el.dataset.n);
    const p0 = toWorld(e.clientX, e.clientY);
    linking = { from:n.id, x:p0.x, y:p0.y };
    svg.setPointerCapture(e.pointerId);
    draw();
    return;
  }
  if(el){
    const n = data().nodes.find(x => x.id === el.dataset.n);
    const p = toWorld(e.clientX, e.clientY);
    selected = n.id; svg.setPointerCapture(e.pointerId);
    draw(); openDrawer("right");
    // 注意：必须在 draw() 之后取线段元素，否则拿到的是被重绘丢弃的旧节点
    const linked = data().edges
      .filter(x => x.from === n.id || x.to === n.id)
      .map(x => ({ e:x, el:gE.querySelector(`[data-e="${x.id}"]`) }))
      .filter(x => x.el);
    drag = { id:n.id, dx:p.x - n.x, dy:p.y - n.y, linked };
    return;
  }
  if(selected){
    const el2 = e.target.closest("[data-n]");
    if(!el2){ selected = null; draw(); }
  }
  pan = { sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y };
  svg.classList.add("pan");
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if(linking){
    const p = toWorld(e.clientX, e.clientY);
    linking.x = p.x; linking.y = p.y;
    const tmp = gN.querySelector("#linkLine");
    if(tmp){
      const a = data().nodes.find(n => n.id === linking.from);
      tmp.setAttribute("x1", a ? a.x : 0); tmp.setAttribute("y1", a ? a.y : 0);
      tmp.setAttribute("x2", p.x); tmp.setAttribute("y2", p.y);
    }
    return;
  }
  if(drag){
    const n = data().nodes.find(x => x.id === drag.id); if(!n) return;
    const p = toWorld(e.clientX, e.clientY);
    n.x = p.x - drag.dx; n.y = p.y - drag.dy;
    const g = gN.querySelector(`[data-n="${drag.id}"]`);
    if(g) g.setAttribute("transform", `translate(${n.x},${n.y})`);
    // 连线跟着动，不然要等松手才更新
    (drag.linked || []).forEach(function(item){
      const e = item.e, el = item.el;
      if(e.from === drag.id){ el.setAttribute("x1", n.x); el.setAttribute("y1", n.y); }
      else { el.setAttribute("x2", n.x); el.setAttribute("y2", n.y); }
    });
    return;
  }
  if(pan){
    view.x = pan.vx + (e.clientX - pan.sx);
    view.y = pan.vy + (e.clientY - pan.sy);
    applyView(); return;
  }
  if(drag || pan) return;
  const el = e.target.closest("[data-n]");
  const id = el ? el.dataset.n : null;
  if(id !== hover){ hover = id; draw(); }
});
svg.addEventListener("pointerup", e => {
  if(linking){
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const hit = target && target.closest("[data-n]");
    const from = linking.from;
    linking = null;
    if(hit && hit.dataset.n && hit.dataset.n !== from){
      const d = data();
      const a = d.nodes.find(n => n.id === from), b = d.nodes.find(n => n.id === hit.dataset.n);
      if(a && b){
        const dup = d.edges.find(x => (x.from === a.id && x.to === b.id) || (x.from === b.id && x.to === a.id));
        if(dup){ toast("这两个人已经有关系了"); }
        else{
          dialogForm("建立关系", a.name + " → " + b.name + "：写清这条关系是怎么来的，它就是这条关系的证据",
            [{k:"type",label:"类型",type:"select",opts:RELS},
             {k:"strength",label:"强度",ph:"1-5"},
             {k:"note",label:"备注（=证据）",type:"area",ph:"怎么认识的 / 谁说的 / 亲眼见过什么"},
             {k:"src",label:"来源可靠性",type:"select",opts:SRC_OPTS},
             {k:"cred",label:"情报可信度",type:"select",opts:CRED_OPTS}],
            { type:"其他", strength:"3", note:"", src:SRC_OPTS[2], cred:CRED_OPTS[2] },
            v => {
              const e = mkEdge(a.id, b.id, v.type || "其他",

              e.grade = (v.src||"C")[0] + (v.cred||"3")[0];
              d.edges.push(e);

    }

});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const before = toWorld(e.clientX, e.clientY);
  view.k = Math.min(2.4, Math.max(0.3, view.k * (e.deltaY > 0 ? 0.92 : 1.08)));
  const after = toWorld(e.clientX, e.clientY);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;
  applyView();
}, { passive:false });

document.addEventListener("keydown", ev => {
  if(ev.key === "F11" || ev.keyCode === 122){
    ev.preventDefault();
    if(window.chrome && window.chrome.webview) window.chrome.webview.postMessage("fullscreen");
  }
}, true);

window.chrome && window.chrome.webview && window.chrome.webview.addEventListener("message", ev => {
  const s = String(ev.data || "");
  if(s.startsWith("RESTORE:")){
    const payload = s.slice(8);
    if(!payload || payload.length < 8) return;
    try{
      const d = JSON.parse(payload);
      if(!Array.isArray(d.folders) || !d.folders.length) return;
      if(localStorage.getItem(KEY)) return;          // 已有数据时不覆盖
      folders = d.folders; curId = d.cur || folders[0].id;
      save(); refreshFolders(); layout(layoutKind); draw(); center(true);
      toast("已从本地备份恢复 " + folders.length + " 个文件夹");
    }catch(e){}
    return;
  }
  if(s.startsWith("SHOT:")){
    const path = s.slice(5);
    if(typeof window.__shotWaiter === "function"){ window.__shotWaiter(path); window.__shotWaiter = null; }
    return;
  }
  if(s.startsWith("MEMOS:")){
    try{
      const arr = JSON.parse(s.slice(6));
      const d = data();
      let n = d.nodes.find(x => x.name === "速记（手机）");
      if(!n){ n = mkNode("速记（手机）", "other"); n.tags = ["速记"]; d.nodes.push(n); }
      n.events = n.events || [];
      let add = 0;
      arr.forEach(m => {
        if(!m.text) return;
        if(n.events.some(e => e.text === m.text && Math.abs((e.at||0)-(m.at||0)) < 1000)) return;
        n.events.push({ at: m.at || now(), text: m.text }); add++;
      });
      save(); draw(); openDrawer("left"); tab = "over"; draw();
      toast(`已拉取 ${add} 条速记，可在右侧详情里看和改`);
    }catch(e){ toast("速记文件解析失败"); }
    return;
  }
  toast(s || "完成");
});

/*<IMPORT>*/
const TYPE_BY_LABEL = { "人物":"person", "组织":"org", "地点":"place", "账号":"account", "其他":"other" };
/* 把 guangxiw.relations（导出/手机传回的摘要）还原成一个完整文件夹：人、账号、其他信息、关系全都在 */
function relationsToFolder(obj){
  const nodes = [], edges = [], byName = {};
  function node(name, type){
    const key = name + "\u0000" + type;
    if(byName[key]) return byName[key];
    const n = mkNode(name, type);
    byName[key] = n; nodes.push(n); return n;
  }
  (obj.persons || []).forEach(p => {
    if(!p || !p.name) return;
    const n = node(p.name, TYPE_BY_LABEL[p.toType] || "person");
    n.accounts = (p.accounts || []).map(a => ({
      platform: a.platform || "", handle: a.handle || a.label || "", note: a.note || ""
    }));
    n.attrs = (p.attrs || []).map(a => ({ k: a.k || a.key || "", v: a.v || a.value || "" }));
    n.events = (p.events || []).map(e => ({ at:e.at||0, text:e.text||"", st:e.st||"", shot:e.shot||"" }));
    n.todos = (p.todos || []).map(td => ({ id:uid("td"), text:td.text||"", how:td.how||"", at:td.at||0, done:!!td.done }));
    const tmpRels = (p.relations || []).slice();
    // 先记下来，等所有人建完再连线
    n.__rels = tmpRels;
  });
  nodes.forEach(n => {
    (n.__rels || []).forEach(r => {
      if(!r || !r.to) return;
      const o = node(r.to, TYPE_BY_LABEL[r.toType] || "person");
      if(o === n) return;
      const dup = edges.find(e => (e.from===n.id&&e.to===o.id)||(e.from===o.id&&e.to===n.id));
      if(dup){
        if(!dup.strength && r.strength) dup.strength = r.strength;
        if(!dup.note && r.note) dup.note = r.note;
        if(!dup.evidence && r.evidence) dup.evidence = r.evidence;
        if(!dup.grade && r.grade) dup.grade = r.grade;
        return;
      }
      const e = mkEdge(n.id, o.id, r.type || "其他", r.strength || 3, r.note || "");
      e.evidence = r.evidence || "";
      e.grade = r.grade || "";
      edges.push(e);
    });
    delete n.__rels;
  });
  return { id: uid("f"), name: (obj.folder || "导入的关系网").trim(), nodes, edges };
}
/*</IMPORT>*/
function importSJ(obj){
  if(!obj || !Array.isArray(obj.persons)) return toast("不是关系网导出文件");
  const f = relationsToFolder(obj);
  if(!f.nodes.length) return toast("文件里没有人物");
  folders.push(f); curId = f.id;
  save(); refreshFolders(); layout(layoutKind); draw(); center(true);
  toast(`已导入「${f.name}」：${f.nodes.length} 个实体 · ${f.edges.length} 条关系`);
}

/* ═══════════════ 从 SJ Lens「导出所有数据」的备份里搬数据本 ═══════════════
   格式：{ app:"SJ Lens", version:2, persons:[{ name, accounts:[{platform,label,url}],
           ledger:[{kind,field,value,src,grade,status,at,note,...}] }] }
   搬法（尽量不丢信息，也不乱建东西）：
   - 每个目标 → 一个「人物」实体（同名就复用，不重复建）
   - ACCOUNT 记录 → 实体的账号；RELATION 记录 → 连到对方实体的连线（备注当证据正文）
   - 有时间的记录 → 记进「记录」（时间线）；没时间的 → 进「其他信息」
   - 来源可靠性/情报可信度（grade）→ 连线的证据等级；备注原样保留
*/
const SJ_KIND_LABEL = { ACCOUNT:"账号", IDENTITY:"身份", CONTACT:"联系方式", ORG:"组织",
  LOCATION:"地点", TIMELINE:"时间", RELATION:"关系", CONTENT:"内容", BEHAVIOR:"行为", OTHER:"其他" };
const SJ_PLATFORM = { BILI:"B站", DOUYIN:"抖音", KUAISHOU:"快手", QQZONE:"QQ空间", WEIBO:"微博", XIAOHONGSHU:"小红书" };

function importSjBackup(obj){
  if(!obj || obj.app !== "SJ Lens" || !Array.isArray(obj.persons))
    return toast("这不是 SJ Lens 的备份文件（应为「导出所有数据」那份 JSON）");
  const d = data();
  const byName = {};
  d.nodes.forEach(n => { byName[n.name.trim()] = n; });
  function ensure(name, type){
    const key = String(name || "").trim();
    if(!key) return null;
    if(byName[key]) return byName[key];
    const n = mkNode(key, type || "person");
    d.nodes.push(n); byName[key] = n; return n;
  }
  let nNode = 0, nAcc = 0, nRel = 0, nEv = 0, nAttr = 0;
  const before = d.nodes.length;

  obj.persons.forEach(p => {
    if(!p || !p.name) return;
    const self = ensure(p.name, "person");
    if(!self) return;
    (p.accounts || []).forEach(a => {
      const plat = SJ_PLATFORM[a.platform] || a.platform || "";
      const handle = a.label || "";
      if(!plat && !handle) return;
      self.accounts = self.accounts || [];
      if(self.accounts.some(x => (x.platform||"") === plat && (x.handle||"") === handle)) return;
      self.accounts.push({ platform: plat, handle, note: a.url || "" });
      nAcc++;
    });
    (p.ledger || []).forEach(r => {
      if(!r) return;
      const kind = r.kind || "OTHER";
      const field = r.field || "";
      const value = r.value || "";
      const src = r.src || "";
      const grade = r.grade || "";
      const note = r.note || "";
      if(kind === "ACCOUNT"){
        const plat = SJ_PLATFORM[field] || field;
        self.accounts = self.accounts || [];
        if(value && !self.accounts.some(x => (x.platform||"") === plat && (x.handle||"") === value)){
          self.accounts.push({ platform: plat, handle: value, note: note || src });
          nAcc++;
        }
        return;
      }
      if(kind === "RELATION"){
        const other = ensure(value, "person");
        if(!other || other === self) return;
        const dup = d.edges.find(e => (e.from===self.id&&e.to===other.id)||(e.from===other.id&&e.to===self.id));
        if(dup){
          if(!dup.note && (note || src)) dup.note = note || src;
          if(!dup.grade && grade) dup.grade = grade;
          if(!dup.type && field) dup.type = field;
          return;
        }
        const e = mkEdge(self.id, other.id, field || "其他", 3, note || src || "");
        e.grade = grade;
        d.edges.push(e);
        nRel++;
        return;
      }
      self.events = self.events || [];
      self.attrs = self.attrs || [];
      const at = Number(r.at) || 0;
      const label = field || SJ_KIND_LABEL[kind] || kind;
      if(at > 0){
        const text = (value || "") + (note ? " · " + note : "") + (src ? " · 来源 " + src : "");
        if(!self.events.some(x => (x.at||0) === at && (x.text||"") === text)){
          self.events.push({ at, text, st:"", shot:"" });
          nEv++;
        }
      } else {
        self.attrs.push({ k: label, v: (value || "") + (note ? "（" + note + "）" : "") + (grade ? " [" + grade + "]" : "") });
        nAttr++;
      }
    });
  });

  nNode = d.nodes.length - before;
  save(); layout(layoutKind); draw(); center(true);
  toast(`已导入 SJ 数据本：新增 ${nNode} 个实体、${nAcc} 个账号、${nRel} 条关系、${nEv} 条记录、${nAttr} 条其他信息`);
}

/* 头像 */
let avatarFor = null;
let evShotFor = null;
$("shotPick").onchange = () => {
  const f = $("shotPick").files[0]; if(!f || !evShotFor) return;
  const d = data();
  const n = d.nodes.find(x => x.id === evShotFor.nodeId);
  if(!n || !n.events || !n.events[evShotFor.idx]) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const max = 900, sc = Math.min(1, max / Math.max(img.width, img.height));
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", 0.72);
      const done = (path) => {
        // 桌面版把图片落到 数据目录\shots，记录里只存路径；浏览器里没有宿主就退回内嵌
        n.events[evShotFor.idx].shot = path || dataUrl;
        evShotFor = null; save(); drawRight();
        toast(path ? "已附截图（已存到 shots 目录）" : "已附截图");
      };
      if(window.chrome && window.chrome.webview){
        window.__shotWaiter = done;
        window.chrome.webview.postMessage("saveShot:" + JSON.stringify({ data: dataUrl }));
      } else done("");
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
};
$("avPick").onchange = () => {
  const f = $("avPick").files[0]; if(!f || !avatarFor) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 96, c = document.createElement("canvas");
      c.width = s; c.height = s;
      const ctx = c.getContext("2d"), m = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, s, s);
      const n = data().nodes.find(x => x.id === avatarFor);
      if(n){ n.avatar = c.toDataURL("image/jpeg", .84); save(); draw(); toast("头像已更新"); }
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
};

/* 最短路径 */
function shortestPath(nodes, edges, fromId, toId){
  if(!fromId || !toId) return null;
  if(fromId === toId) return { nodes:[fromId], edges:[] };
  const adj = {};
  nodes.forEach(n => { adj[n.id] = []; });
  edges.forEach(e => {
    if(adj[e.from] && adj[e.to]){
      adj[e.from].push({ to:e.to, id:e.id });
      adj[e.to].push({ to:e.from, id:e.id });
    }
  });
  const prev = {}, prevEdge = {}, seen = {};
  const q = [fromId]; seen[fromId] = true;
  while(q.length){
    const cur = q.shift();
    if(cur === toId) break;
    (adj[cur] || []).forEach(s => {
      if(seen[s.to]) return;
      seen[s.to] = true; prev[s.to] = cur; prevEdge[s.to] = s.id; q.push(s.to);
    });
  }
  if(!seen[toId]) return null;
  const cn = [toId], ce = [];
  let cur = toId;
  while(cur !== fromId){ ce.push(prevEdge[cur]); cur = prev[cur]; cn.push(cur); }
  return { nodes:cn.reverse(), edges:ce.reverse() };
}
