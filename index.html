<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuangXIW</title>
<style>
/* ─────────────────────────────────────────────────────────────
   GuangXIW · 关系网
   版面：顶栏一条 + 画布铺满 + 左右抽屉覆盖（不改画布尺寸，杜绝挤压）
   风格：档案纸感 —— 细线、字距、等宽数字；只有一个黄铜强调色
   ───────────────────────────────────────────────────────────── */
:root{
  --ink:#101317; --ink2:#14181d; --panel:#161a20; --raise:#1b2027; --raise2:#20262e;
  --hair:#242a32; --hair2:#313943;
  --fg:#d7d4cf; --fg2:#a7aab1; --fg3:#71767f;
  --brass:#c8a96a; --steel:#8aa2bd; --rust:#c47b62; --moss:#7e9c86;
  --sans:"Noto Sans SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--fg);
  font:14.5px/1.7 var(--sans);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:auto;text-shadow:0 0 .35px rgba(255,255,255,.14)}
body{background-image:radial-gradient(circle at 1px 1px,#22272e 1px,transparent 0);
  background-size:26px 26px;background-position:-1px -1px}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden}

/* ── 顶栏 ── */
#bar{position:absolute;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:linear-gradient(180deg,rgba(16,19,23,.97),rgba(16,19,23,.86));
  border-bottom:1px solid var(--hair);z-index:30}
#bar .sig{display:flex;align-items:center;gap:9px;flex:none}
#bar .sig svg{width:19px;height:19px;border-radius:4px}
#bar .sig b{font-weight:600;font-size:14.5px;letter-spacing:.02em}
#bar .sig b i{font-style:normal;color:var(--brass)}
#bar .case{display:flex;align-items:center;gap:8px;flex:none;
  padding-left:14px;border-left:1px solid var(--hair)}
#bar .case span{font:11px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);text-transform:uppercase}
select{background:var(--raise);border:1px solid var(--hair2);border-radius:5px;height:30px;
  padding:0 8px;outline:none;max-width:168px;transition:.15s}
select:hover{border-color:#3d4650}
#q{flex:1 1 auto;min-width:90px;max-width:280px;height:30px;background:var(--raise);
  border:1px solid var(--hair2);border-radius:5px;padding:0 10px;outline:none;transition:.15s}
#q:focus{border-color:var(--brass);background:var(--raise2)}
#bar .grow{flex:1}
.tb{height:30px;padding:0 11px;background:transparent;border:1px solid var(--hair2);border-radius:5px;
  font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;display:inline-flex;
  align-items:center;gap:6px}
.tb:hover{border-color:var(--brass);color:var(--brass)}
.tb:active{transform:translateY(1px)}
.tb.on{background:rgba(200,169,106,.12);border-color:var(--brass);color:var(--brass)}
.tb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.tb.icon{width:30px;padding:0;justify-content:center}

/* ── 画布 ── */
#stage{position:absolute;inset:56px 0 0 0}
svg#g{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
svg#g.pan{cursor:grabbing}
.e{stroke:#333c46;stroke-linecap:round;transition:stroke .15s,opacity .15s}
.e.hot{stroke:var(--brass)}
.e.path{stroke:var(--moss);stroke-width:3.2}
.e.dim{opacity:.14}
.n rect.body{fill:#181d23;stroke:#2b333d;transition:fill .15s,stroke .15s}
.n:hover rect.body{fill:#1e242c;stroke:#3a444f}
.n.sel rect.body{fill:#1f2630;stroke:var(--brass)}
.n.path rect.body{stroke:var(--moss)}
.n.dim{opacity:.22}
.n text{pointer-events:none;font-family:var(--sans)}
.n .nm{fill:#dcd9d3;font-size:13px}
.n .mt{fill:var(--fg3);font-size:10px;letter-spacing:.03em}
.n .bar{pointer-events:none}

/* ── 底部捕获条 ── */
#capture{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:8px;width:min(680px,calc(100% - 40px));
  background:rgba(22,26,32,.96);border:1px solid var(--hair2);border-radius:8px;padding:8px 10px;
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
#capture input{flex:1;background:transparent;border:0;outline:none;font-size:13.5px}
#capture input::placeholder{color:var(--fg3)}
#capture .sep{width:1px;height:20px;background:var(--hair2)}
#hint{position:absolute;left:16px;bottom:20px;z-index:9;font:12px/1.7 var(--sans);
  color:#7c828b;letter-spacing:0;text-shadow:0 0 .4px rgba(255,255,255,.16)}

/* ── 抽屉（左：清单 / 右：详情）── */
.drawer{position:absolute;top:56px;bottom:0;width:300px;z-index:25;display:flex;flex-direction:column;
  background:var(--panel);transition:transform .26s var(--ease);will-change:transform}
#left{left:0;border-right:1px solid var(--hair);transform:translateX(-100%);
  box-shadow:14px 0 30px rgba(0,0,0,.3)}
#left.open{transform:none}
#right{right:0;width:336px;border-left:1px solid var(--hair);transform:translateX(100%);
  box-shadow:-14px 0 30px rgba(0,0,0,.3)}
#right.open{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;
  border-bottom:1px solid var(--hair);font:11px/1 var(--mono);letter-spacing:.14em;
  color:var(--fg3);text-transform:uppercase;flex:none}
.drawer header .x{margin-left:auto}
.body{flex:1;overflow:auto;padding:12px}
.body::-webkit-scrollbar{width:8px}
.body::-webkit-scrollbar-thumb{background:#333b45;border-radius:6px;border:2px solid transparent;background-clip:padding-box}

/* 清单 */
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tab{flex:1;height:28px;border:1px solid var(--hair2);border-radius:5px;background:transparent;
  font-size:12.5px;color:var(--fg2);cursor:pointer;transition:.15s}
.tab.on{border-color:var(--brass);color:var(--brass);background:rgba(200,169,106,.1)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.chip{border:1px solid var(--hair2);border-radius:999px;padding:2px 9px;font-size:11.5px;
  color:var(--fg3);cursor:pointer;transition:.15s}
.chip:hover{color:var(--fg)}
.chip.on{border-color:var(--brass);color:var(--brass);background:rgba(200,169,106,.12)}
.row{display:flex;align-items:center;gap:9px;padding:7px 7px;border-radius:6px;cursor:pointer;
  transition:.13s;font-size:13px}
.row:hover{background:var(--raise)}
.row.sel{background:rgba(200,169,106,.12)}
.row .dot{width:6px;height:6px;border-radius:50%;flex:none}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dg{font:11px/1 var(--mono);color:var(--rust);flex:none}
.evday{font:10.5px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);margin:14px 2px 6px}
.evrow{display:flex;gap:8px;padding:6px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.6}
.evrow:hover{background:var(--raise)}
.evrow .t{font:11px/1.5 var(--mono);color:var(--brass);flex:none;width:36px}
.evrow .w{color:var(--fg2);flex:none;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 详情表单 */
.sec{margin-bottom:14px}
.sec h5{margin:0 0 8px;font:10.5px/1 var(--mono);letter-spacing:.14em;color:var(--fg3);
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec h5::after{content:"";flex:1;height:1px;background:var(--hair)}
.f{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.f>label{width:42px;flex:none;font-size:11px;color:var(--fg3)}
input[type=text],input[type=search],textarea{width:100%;min-width:0;background:var(--raise);
  border:1px solid var(--hair2);border-radius:5px;height:30px;padding:0 9px;outline:none;transition:.15s}
textarea{height:auto;min-height:58px;padding:7px 9px;line-height:1.6;resize:vertical}
input:focus,textarea:focus{border-color:var(--brass);background:var(--raise2)}
.bt{height:30px;padding:0 11px;border-radius:5px;border:1px solid var(--hair2);background:var(--raise);
  font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.bt:hover{border-color:var(--brass);color:var(--brass)}
.bt.solid{background:rgba(200,169,106,.14);border-color:var(--brass);color:var(--brass)}
.bt.wide{width:100%}
.bt.danger{color:var(--rust);border-color:#3d2a26}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;background:var(--raise2);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--brass);
  border:1px solid var(--hair2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.kv{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 6px;border-radius:5px}
.kv:hover{background:var(--raise)}
.kv .k{color:var(--fg3);min-width:52px}
.kv .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel{display:flex;align-items:center;gap:8px;padding:6px;border-radius:5px;font-size:12.5px;cursor:pointer}
.rel:hover{background:var(--raise)}
.rel .s{margin-left:auto;font:11px/1 var(--mono);color:var(--rust)}
.rel .ev{font:10.5px/1 var(--mono);color:var(--fg3)}
.empty{color:var(--fg3);font-size:12px;padding:8px 4px;line-height:1.8}
.foot{font:11px/1.7 var(--mono);color:var(--fg3);letter-spacing:.03em}
.foot b{color:var(--fg2);font-weight:500}

/* ── 对话框 / 提示 ── */
#veil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(9,11,14,.66)}
#veil.on{display:flex}
#box{width:min(430px,92vw);background:var(--panel);border:1px solid var(--hair2);border-radius:10px;
  padding:20px 22px;box-shadow:0 22px 60px rgba(0,0,0,.55)}
#box h4{margin:0 0 5px;font-size:15.5px;font-weight:600}
#box p{margin:0 0 13px;font-size:12.5px;color:var(--fg2);line-height:1.7}
#box .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);z-index:70;
  background:var(--raise2);border:1px solid var(--brass);border-radius:7px;padding:8px 14px;
  font-size:12.5px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="sig">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.2" fill="#c8a96a"/><circle cx="18" cy="10" r="2.6" fill="#8aa2bd"/>
        <circle cx="9" cy="19" r="2.6" fill="#8aa2bd"/><g stroke="#4a5561" stroke-width="1.4">
        <line x1="6" y1="6" x2="18" y2="10"/><line x1="6" y1="6" x2="9" y2="19"/><line x1="18" y1="10" x2="9" y2="19"/></g></svg>
      <b>Guang<i>XIW</i></b>
    </div>
    <div class="case">
      <span>case</span>
      <select id="folderSel"></select>
      <button class="tb icon" id="folderAdd" title="新建文件夹">+</button>
    </div>
    <input id="q" type="search" placeholder="搜人名 / 标签">
    <div class="grow"></div>
    <button class="tb" id="pathBtn" title="查两人之间的最短关系链">路径</button>
    <button class="tb" id="tidyBtn" title="把内容挪到画布正中">归整</button>
    <button class="tb icon" id="leftBtn" title="实体清单">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="tb icon" id="rightBtn" title="详情面板 (Ctrl+K)">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/></svg></button>
  </div>

  <div id="stage">
    <svg id="g"><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="hint">拖动画布 · 滚轮缩放 · 双击空白新建 · Ctrl+K 详情</div>
    <div id="capture">
      <input id="capInput" placeholder="速记：选中谁就记到谁名下（回车）">
      <div class="sep"></div>
      <button class="bt" id="addBtn">人物</button>
      <button class="bt solid" id="capBtn">记一笔</button>
    </div>
  </div>

  <aside class="drawer" id="left">
    <header><span>清单</span><button class="tb icon x" id="leftClose">×</button></header>
    <div class="tabs">
      <button class="tab on" id="tabList">实体</button>
      <button class="tab" id="tabTime">时间线</button>
      <button class="tab" id="tabFolder">文件夹</button>
    </div>
    <div class="body" id="leftBody"></div>
  </aside>

  <aside class="drawer" id="right">
    <header><span>详情</span><button class="tb icon x" id="rightClose">×</button></header>
    <div class="body" id="rightBody"></div>
  </aside>

  <div id="veil"><div id="box">
    <h4 id="bTitle"></h4><p id="bDesc"></p>
    <input type="text" id="bInput"><textarea id="bArea"></textarea>
    <div class="acts"><button class="bt" id="bCancel">取消</button><button class="bt solid" id="bOk">确定</button></div>
  </div></div>
  <div id="toast"></div>
</div>
<input type="file" id="filePick" accept=".json,application/json" hidden>
<input type="file" id="avPick" accept="image/*" hidden>
<script>
/* ═══════════════ 数据层 ═══════════════ */
const VERSION = "2.0.0";
const KEY = "guangxiw.v2";
const TYPES = [["person","人物"],["org","组织"],["place","地点"],["account","账号"],["other","其他"]];
const TYPE_LABEL = Object.fromEntries(TYPES);
const TYPE_COLOR = {person:"#c8a96a", org:"#8aa2bd", place:"#b99a6b", account:"#8ba0b5", other:"#8b9099"};
const RELS = ["亲属","同事","同学","好友","资金","同平台","其他"];
const NW = 168, NH = 60;

let folders = [], curId = null, selected = null;
let view = {x:0, y:0, k:1}, drag = null, pan = null, hover = null;
let pathN = new Set(), pathE = new Set();
let filterType = null, tab = "list";

const $ = id => document.getElementById(id);
const uid = p => p + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now = () => Date.now();
const fmt = ts => { if(!ts) return "—"; const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const data = () => folders.find(f => f.id === curId) || folders[0];

const mkNode = (name, type = "person") => ({ id:uid("n"), name, type, tags:[], accounts:[], attrs:[],
  events:[], avatar:"", x:0, y:0 });
const mkEdge = (from, to, type = "其他", strength = 3, note = "", evidence = "") =>
  ({ id:uid("e"), from, to, type, strength, note, evidence, at: now() });

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({ folders, cur:curId, v:VERSION })); }
  catch(e){ toast("保存失败：头像过多"); }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.folders) && d.folders.length){ folders = d.folders; curId = d.cur || folders[0].id; }
    }
    if(!folders.length){
      // 从旧版本（v1）迁移，不丢用户已经录的关系
      const old = localStorage.getItem("guangxiw.v1");
      if(old){
        const d = JSON.parse(old);
        if(Array.isArray(d.folders) && d.folders.length){ folders = d.folders; curId = d.cur || folders[0].id; }
        else if(Array.isArray(d.cases) && d.cases.length){
          folders = d.cases.map(c => ({ id:c.id || uid("f"), name:c.name || "文件夹", nodes:c.nodes || [], edges:c.edges || [] }));
          curId = d.cur && folders.some(f=>f.id===d.cur) ? d.cur : folders[0].id;
        } else if(Array.isArray(d.nodes)){
          folders = [{ id:uid("f"), name:"默认文件夹", nodes:d.nodes, edges:d.edges || [] }];
          curId = folders[0].id;
        }
      }
    }
  }catch(e){}
  if(!folders.length){
    const a = mkNode("张三"), b = mkNode("李四"), c = mkNode("某科技公司","org");
    folders = [{ id:uid("f"), name:"默认文件夹", nodes:[a,b,c],
      edges:[mkEdge(a.id,b.id,"同学",3,"高中同桌"), mkEdge(a.id,c.id,"同事",4,"同公司")] }];
    curId = folders[0].id;
  }
  // 兼容旧字段
  folders.forEach(f => f.nodes.forEach(n => {
    if(!Array.isArray(n.events)) n.events = [];
    if(!Array.isArray(n.accounts)) n.accounts = [];
    if(!Array.isArray(n.attrs)) n.attrs = [];
    if(n.note && !n.events.length){ n.events.push({ at:0, text:n.note }); n.note = ""; }
  }));
}

/* ═══════════════ 弹层 ═══════════════ */
let dlgCb = null, dlgMode = "text";
function dialog(mode, title, desc, ph, val, cb){
  dlgMode = mode; dlgCb = cb;
  $("bTitle").textContent = title; $("bDesc").textContent = desc || "";
  $("bInput").style.display = mode === "area" ? "none" : "block";
  $("bArea").style.display = mode === "area" ? "block" : "none";
  if(mode === "area"){ $("bArea").value = val || ""; $("bArea").placeholder = ph || ""; setTimeout(()=>$("bArea").focus(),50); }
  else { $("bInput").value = val || ""; $("bInput").placeholder = ph || ""; setTimeout(()=>$("bInput").focus(),50); }
  $("veil").classList.add("on");
}
function closeDlg(){ $("veil").classList.remove("on"); dlgCb = null; }
$("bCancel").onclick = closeDlg;
$("bOk").onclick = () => {
  const v = dlgMode === "area" ? $("bArea").value : $("bInput").value;
  const cb = dlgCb; closeDlg(); if(cb) cb(v);
};
$("bInput").addEventListener("keydown", e => { if(e.key === "Enter") $("bOk").click(); });
$("veil").addEventListener("click", e => { if(e.target.id === "veil") closeDlg(); });
let toastT = null;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 2400);
}

/* ═══════════════ 布局 ═══════════════ */
function layout(kind){
  const d = data(), N = d.nodes, E = d.edges;
  if(!N.length) return;
  if(kind === "circle"){
    const R = Math.max(190, N.length * 25);
    N.forEach((n,i) => { const a = i/N.length*Math.PI*2 - Math.PI/2;
      n.x = Math.cos(a)*R; n.y = Math.sin(a)*R; });
    return;
  }
  if(kind === "degree"){
    const deg = {}; E.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
    const arr = [...N].sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0));
    const cols = Math.max(1, Math.ceil(Math.sqrt(arr.length)));
    arr.forEach((n,i) => { n.x = (i%cols)*270 - (cols-1)*135; n.y = Math.floor(i/cols)*150; });
    return;
  }
  N.forEach((n,i) => { const a = i/N.length*Math.PI*2, R = 120 + N.length*16;
    n.x = Math.cos(a)*R; n.y = Math.sin(a)*R; });
  const by = Object.fromEntries(N.map(n=>[n.id,n]));
  for(let it=0; it<300; it++){
    const fx = {}, fy = {};
    N.forEach(n => { fx[n.id]=0; fy[n.id]=0; });
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const a=N[i], b=N[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2 < 1){ dx = Math.random()-0.5; dy = Math.random()-0.5; d2 = 1; }
      const d = Math.sqrt(d2), f = 56000/d2, ux=dx/d, uy=dy/d;
      fx[a.id]-=ux*f; fy[a.id]-=uy*f; fx[b.id]+=ux*f; fy[b.id]+=uy*f;
    }
    E.forEach(e => {
      const a = by[e.from], b = by[e.to]; if(!a || !b) return;
      const s = e.strength || 3;
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy) || 1;
      const rest = 250 - s*15, k = 0.012*(1+s/6), p = (d-rest)*k, ux=dx/d, uy=dy/d;
      fx[a.id]+=ux*p; fy[a.id]+=uy*p; fx[b.id]-=ux*p; fy[b.id]-=uy*p;
    });
    N.forEach(n => { fx[n.id]-=n.x*0.008; fy[n.id]-=n.y*0.008; });
    N.forEach(n => { const lim = 30;
      n.x += Math.max(-lim, Math.min(lim, fx[n.id]));
      n.y += Math.max(-lim, Math.min(lim, fy[n.id])); });
  }
}

/* ═══════════════ 视图与绘制 ═══════════════ */
const svg = $("g"), vp = $("vp"), gE = $("edges"), gN = $("nodes");
function stageSize(){ const r = $("stage").getBoundingClientRect(); return { w:r.width, h:r.height }; }
function applyView(){
  const { w, h } = stageSize();
  vp.setAttribute("transform", `translate(${view.x + w/2},${view.y + h/2}) scale(${view.k})`);
}
function toWorld(cx, cy){
  const r = svg.getBoundingClientRect();
  return { x:(cx - r.left - view.x - r.width/2)/view.k, y:(cy - r.top - view.y - r.height/2)/view.k };
}
function center(move){
  const { w, h } = stageSize();
  if(!move){ view = { x:0, y:0, k:1 }; applyView(); return; }
  const N = data().nodes;
  if(!N.length){ view = { x:0, y:0, k:1 }; applyView(); return; }
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  N.forEach(n => { x1=Math.min(x1,n.x); x2=Math.max(x2,n.x); y1=Math.min(y1,n.y); y2=Math.max(y2,n.y); });
  view.x = -((x1+x2)/2); view.y = -((y1+y2)/2);
  applyView();
}
function focusNode(n){
  view.x = -n.x*view.k; view.y = -n.y*view.k;
  const el = vp; el.style.transition = "transform .24s " + "ease-out";
  applyView(); setTimeout(()=>{ el.style.transition = ""; }, 260);
}

function draw(){
  const d = data();
  const by = Object.fromEntries(d.nodes.map(n=>[n.id,n]));
  const deg = {}; d.edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
  const q = ($("q").value || "").trim().toLowerCase();
  const focusId = hover || selected;
  const near = new Set();
  if(focusId){
    near.add(focusId);
    d.edges.forEach(e => { if(e.from === focusId) near.add(e.to); if(e.to === focusId) near.add(e.from); });
  }
  const pathOn = pathN.size > 0;

  gE.innerHTML = d.edges.map(e => {
    const a = by[e.from], b = by[e.to]; if(!a || !b) return "";
    const onPath = pathE.has(e.id);
    const hot = onPath || e.from === focusId || e.to === focusId;
    const dim = (!!focusId && !hot) || (pathOn && !onPath);
    const w = 1 + (e.strength || 3) * 0.5;
    return `<line class="e${onPath ? " path" : (hot ? " hot" : "")}${dim ? " dim" : ""}" data-e="${e.id}"
      x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${onPath ? 3.2 : w}">
      <title>${esc(a.name)} — ${esc(e.type)} — ${esc(b.name)}｜强度 ${e.strength||3}${e.evidence ? "｜"+esc(e.evidence) : ""}</title></line>`;
  }).join("");

  gN.innerHTML = d.nodes.map(n => {
    if(filterType && n.type !== filterType) return "";
    const hit = q && (n.name.toLowerCase().includes(q) || (n.tags||[]).join(",").toLowerCase().includes(q));
    const sel = selected === n.id, onPath = pathN.has(n.id);
    const dim = (focusId && !near.has(n.id)) || (pathOn && !onPath);
    const color = TYPE_COLOR[n.type] || TYPE_COLOR.other;
    const L = -NW/2, T = -NH/2;
    const av = n.avatar
      ? `<image href="${n.avatar}" x="${L+12}" y="${T+12}" width="36" height="36" clip-path="inset(0 round 18px)"/>`
      : `<circle cx="${L+30}" cy="${T+30}" r="18" fill="${color}22" stroke="${color}55"/>
         <text x="${L+30}" y="${T+30}" text-anchor="middle" dominant-baseline="central"
           font-size="15" fill="${color}" style="font-family:var(--sans)">${esc((n.name||"?").slice(0,1))}</text>`;
    const sub = [TYPE_LABEL[n.type] || n.type, (n.accounts||[]).length ? (n.accounts.length+" 号") : "",
                 deg[n.id] ? (deg[n.id]+" 关系") : ""].filter(Boolean).join(" · ");
    return `<g class="n${sel ? " sel" : ""}${onPath ? " path" : ""}${dim ? " dim" : ""}"
      data-n="${n.id}" transform="translate(${n.x},${n.y})">
      <rect class="body" x="${L}" y="${T}" width="${NW}" height="${NH}" rx="10"/>
      <rect class="bar" x="${L}" y="${T}" width="2.5" height="${NH}" rx="1" fill="${color}"/>
      ${av}
      <text class="nm" x="${L+58}" y="${T+27}">${esc(n.name.slice(0,9))}</text>
      <text class="mt" x="${L+58}" y="${T+44}">${esc(sub)}</text>
      ${hit ? `<rect x="${L-3}" y="${T-3}" width="${NW+6}" height="${NH+6}" rx="13" fill="none"
        stroke="#c47b62" stroke-width="1.2"/>` : ""}
    </g>`;
  }).join("");

  applyView();
  drawLeft();
  drawRight();
}

  box.innerHTML = `

      <button class="bt danger" id="fDel">删除</button></div>

    </div>
    <div class="sec"><h5>布局</h5>
      <div class="f"><select id="laySel" style="width:100%">
        <option value="force">力导向</option><option value="circle">环形</option><option value="degree">按连接数</option>
      </select></div>
    </div>
    <div class="sec"><h5>导入</h5>

      <button class="bt wide" id="impJson">导入 GuangXIW JSON</button>
    </div>
    <div class="sec"><h5>导出</h5>
      <button class="bt wide" id="expJson" style="margin-bottom:7px">JSON 备份</button>
      <button class="bt wide" id="expMd" style="margin-bottom:7px">Markdown 报告</button>
      <button class="bt wide" id="expSj" style="margin-bottom:7px">给 SJ Lens（手机）</button>
    </div>
    <div class="sec"><h5>关于</h5>
      <div class="foot"><b>GuangXIW ${VERSION}</b><br>SJ Lens 电脑端 / 手机端互通辅助工具<br>数据保存在本机</div>
    </div>`;

  $("laySel").value = "force";
  $("laySel").onchange = () => { layout($("laySel").value); draw(); center(true); };
  $("fRename").onclick = () => dialog("text", "文件夹名称", "", "名称", d.name, v => {
    if(!v) return; d.name = v.trim(); save(); refreshFolders(); draw(); toast("已重命名");
  });
  $("fDel").onclick = () => {
    if(folders.length <= 1) return toast("至少保留一个文件夹");
    dialog("text", "删除文件夹？", `「${d.name}」里的 ${d.nodes.length} 个实体会一起删除。`, "输入 yes 确认", "", v => {
      if((v||"").trim().toLowerCase() !== "yes") return toast("已取消");
      folders = folders.filter(f => f.id !== d.id); curId = folders[0].id;
      selected = null; save(); refreshFolders(); layout("force"); draw(); center(true); toast("已删除");
    });
  };
  $("impSJ").onclick = () => pick(f => importSJ(f));
  $("pasSJ").onclick = () => dialog("area", "粘贴 SJ Lens 备份", "把导出的 JSON 全文粘进来。", "{ … }", "", v => {
    if(!v) return; try{ importSJ(JSON.parse(v)); }catch(e){ toast("不是合法 JSON"); }
  });
  $("impJson").onclick = () => pick(f => importOwn(f));
  $("expJson").onclick = () => exportJson();
  $("expMd").onclick = () => exportMd();
  $("expSj").onclick = () => exportSj();
}

        || `<div class="empty" style="padding:2px 4px">还没有记录。</div>`}</div>

    if(!h) return toast("填个账号");

    save(); draw(); toast("已添加账号");

  $("atAdd").onclick = () => {
    const k = ($("atK").value || "").trim(), v = ($("atV").value || "").trim();
    if(!k || !v) return toast("项目和内容都要填");

    save(); draw(); toast("已添加");

      n.accounts.splice(i,1); save(); draw();

  box.querySelectorAll("[data-attr]").forEach(el => el.onclick = () => {
    const i = +el.dataset.attr;
    dialog("text", "删除这条信息？", `${(n.attrs[i]||{}).k}：${(n.attrs[i]||{}).v}`, "输入 yes 确认", "", v => {
      if((v||"").trim().toLowerCase() !== "yes") return;
      n.attrs.splice(i,1); save(); draw();
    });
  });
  box.querySelectorAll("[data-evrow]").forEach(el => el.onclick = () => {
    const i = +el.dataset.evrow;
    const sorted = (n.events||[]).slice().sort((a,b)=>(b.at||0)-(a.at||0));
    const item = sorted[i]; if(!item) return;
    dialog("text", "删除这条记录？", item.text, "输入 yes 确认", "", v => {
      if((v||"").trim().toLowerCase() !== "yes") return;
      n.events = n.events.filter(x => x !== item); save(); draw();
    });

  let busy = false;
  const addRel = () => {
    if(busy) return; busy = true; setTimeout(() => busy = false, 500);
    const name = ($("rTo").value || "").trim().replace(/\s+/g, " ");
    if(!name) return toast("先填对方名字");
    if(name === n.name) return toast("不能和自己建立关系");
    let other = d.nodes.find(x => x.id !== n.id && x.name.trim() === name);
    if(!other){ other = mkNode(name); d.nodes.push(other); }
    const type = $("rType").value, ev = ($("rEv").value||"").trim(), note = ($("rNote").value||"").trim();
    const dup = d.edges.find(e => (e.from===n.id&&e.to===other.id)||(e.from===other.id&&e.to===n.id));
    if(dup){ dup.type = type; dup.strength = strength; if(ev) dup.evidence = ev; if(note) dup.note = note; toast("关系已更新"); }
    else { d.edges.push(mkEdge(n.id, other.id, type, strength, note, ev)); toast("已建立关系"); }
    save(); layout("force"); draw(); center(true);
  };
  $("rAdd").onclick = addRel;
  ["rTo","rEv","rNote"].forEach(id => $(id).addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); addRel(); } }));
  box.querySelectorAll("[data-rel]").forEach(el => el.onclick = () => {
    const id = el.dataset.rel, e0 = d.edges.find(x => x.id === id);

      if((v||"").trim().toLowerCase() !== "yes") return;
      d.edges = d.edges.filter(x => x.id !== id); save(); draw();
    });
  });
  $("nDel").onclick = () => dialog("text", "删除这个实体？", "相连的关系会一起删除。", "输入 yes 确认", "", v => {
    if((v||"").trim().toLowerCase() !== "yes") return;
    d.nodes = d.nodes.filter(x => x.id !== n.id);
    d.edges = d.edges.filter(e => e.from !== n.id && e.to !== n.id);
    selected = null; save(); draw(); toast("已删除");
  });
}

  const el = e.target.closest("[data-n]");
  if(el){
    const n = data().nodes.find(x => x.id === el.dataset.n);
    const p = toWorld(e.clientX, e.clientY);
    selected = n.id; svg.setPointerCapture(e.pointerId);
    draw(); openDrawer("right");
    // 注意：必须在 draw() 之后取线段元素，否则拿到的是被重绘丢弃的旧节点
    const linked = data().edges
      .filter(x => x.from === n.id || x.to === n.id)
      .map(x => ({ e:x, el:gE.querySelector(`[data-e="${x.id}"]`) }))
      .filter(x => x.el);
    drag = { id:n.id, dx:p.x - n.x, dy:p.y - n.y, linked };
    return;
  }
  if(selected){
    const el2 = e.target.closest("[data-n]");
    if(!el2){ selected = null; draw(); }
  }
  pan = { sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y };
  svg.classList.add("pan");
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if(drag){
    const n = data().nodes.find(x => x.id === drag.id); if(!n) return;
    const p = toWorld(e.clientX, e.clientY);
    n.x = p.x - drag.dx; n.y = p.y - drag.dy;
    const g = gN.querySelector(`[data-n="${drag.id}"]`);
    if(g) g.setAttribute("transform", `translate(${n.x},${n.y})`);
    // 连线跟着动，不然要等松手才更新
    (drag.linked || []).forEach(function(item){
      const e = item.e, el = item.el;
      if(e.from === drag.id){ el.setAttribute("x1", n.x); el.setAttribute("y1", n.y); }
      else { el.setAttribute("x2", n.x); el.setAttribute("y2", n.y); }
    });
    return;
  }
  if(pan){
    view.x = pan.vx + (e.clientX - pan.sx);
    view.y = pan.vy + (e.clientY - pan.sy);
    applyView(); return;
  }
  if(drag || pan) return;
  const el = e.target.closest("[data-n]");
  const id = el ? el.dataset.n : null;
  if(id !== hover){ hover = id; draw(); }
});
svg.addEventListener("pointerup", () => {
  if(drag){ save(); drag = null; }
  pan = null; svg.classList.remove("pan");
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const before = toWorld(e.clientX, e.clientY);
  view.k = Math.min(2.4, Math.max(0.3, view.k * (e.deltaY > 0 ? 0.92 : 1.08)));
  const after = toWorld(e.clientX, e.clientY);
  view.x += (after.x - before.x) * view.k;
  view.y += (after.y - before.y) * view.k;
  applyView();
}, { passive:false });
svg.addEventListener("dblclick", e => {
  e.preventDefault();
  if(e.target.closest("[data-n]")) return;
  const p = toWorld(e.clientX, e.clientY);
  dialog("text", "新增人物", "输入名字，回车加入。", "名字", "", name => {
    if(!name) return;
    const d = data(), n = mkNode(name.trim());
    n.x = p.x; n.y = p.y; d.nodes.push(n);
    selected = n.id; save(); draw(); openDrawer("right"); toast("已添加 " + name);
  });
});

/* ═══════════════ 顶栏动作 ═══════════════ */
function refreshFolders(){
  const sel = $("folderSel");
  sel.innerHTML = folders.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("");
  sel.value = curId;
}
$("folderSel").onchange = e => {
  curId = e.target.value; selected = null; save();
  layout("force"); draw(); center(true);
};
$("folderAdd").onclick = () => dialog("text", "新建文件夹", "一个文件夹装一个调查目标。", "文件夹名", "", name => {
  if(!name) return;
  const a = mkNode("张三"), b = mkNode("李四");
  const f = { id:uid("f"), name:name.trim(), nodes:[a,b], edges:[mkEdge(a.id,b.id,"其他",3)] };
  folders.push(f); curId = f.id; save(); refreshFolders();
  layout("force"); draw(); center(true); toast("已新建 " + name);
});
$("tidyBtn").onclick = () => {
  layout("force"); draw();
  const el = vp; el.style.transition = "transform .26s ease-out";
  center(true); setTimeout(()=>{ el.style.transition = ""; }, 300);
};
$("pathBtn").onclick = () => {
  const names = data().nodes.map(n => n.name).join("、").slice(0, 70);
  dialog("text", "最短关系链 · 起点", "现有：" + names, "起点名字", "", a => {
    if(!a) return;
    const from = data().nodes.find(n => n.name === a.trim());
    if(!from) return toast("没有这个实体：" + a);
    dialog("text", "最短关系链 · 终点", "从「" + from.name + "」出发连到谁？", "终点名字", "", b => {
      if(!b) return;
      const to = data().nodes.find(n => n.name === b.trim());
      if(!to) return toast("没有这个实体：" + b);
      const res = shortestPath(data().nodes, data().edges, from.id, to.id);
      if(!res){ pathN = new Set(); pathE = new Set(); draw(); return toast("两人之间没有通路"); }
      pathN = new Set(res.nodes); pathE = new Set(res.edges); draw();
      toast(res.nodes.map(id => (data().nodes.find(x=>x.id===id)||{}).name).join(" → ") + `（${res.nodes.length-1} 步）`);
    });
  });
};
$("q").addEventListener("input", () => draw());
$("addBtn").onclick = () => dialog("text", "新增人物", "输入名字，回车加入。", "名字", "", name => {
  if(!name) return;
  const d = data(), n = mkNode(name.trim()); d.nodes.push(n);
  selected = n.id; save(); layout("force"); draw(); center(true); openDrawer("right"); toast("已添加 " + name);
});
$("capBtn").onclick = capture;
$("capInput").addEventListener("keydown", e => { if(e.key === "Enter") capture(); });
function capture(){
  const inp = $("capInput"), text = (inp.value || "").trim();
  if(!text) return;
  const d = data(), n = d.nodes.find(x => x.id === selected);
  if(n){ n.events = n.events || []; n.events.push({ at:now(), text }); toast("已记到 " + n.name); }
  else {
    const nn = mkNode(text.slice(0,16), "other");
    nn.events = [{ at:now(), text }]; nn.tags = ["速记"];
    d.nodes.push(nn); selected = nn.id; toast("已新建速记实体");
  }
  inp.value = ""; save(); draw();
}

/* 抽屉 */
function openDrawer(which){
  if(which === "left") $("left").classList.add("open");
  if(which === "right") $("right").classList.add("open");
  $("leftBtn").classList.toggle("on", $("left").classList.contains("open"));
  $("rightBtn").classList.toggle("on", $("right").classList.contains("open"));
}
function closeDrawer(which){
  $(which).classList.remove("open");
  $("leftBtn").classList.toggle("on", $("left").classList.contains("open"));
  $("rightBtn").classList.toggle("on", $("right").classList.contains("open"));
}
$("leftBtn").onclick = () => $("left").classList.contains("open") ? closeDrawer("left") : openDrawer("left");
$("rightBtn").onclick = () => $("right").classList.contains("open") ? closeDrawer("right") : openDrawer("right");
$("leftClose").onclick = () => closeDrawer("left");
$("rightClose").onclick = () => closeDrawer("right");
$("tabList").onclick = () => { tab = "list"; draw(); };
$("tabTime").onclick = () => { tab = "time"; draw(); };
$("tabFolder").onclick = () => { tab = "folder"; draw(); };
document.addEventListener("keydown", e => {
  if((e.ctrlKey && e.key.toLowerCase() === "k")){ e.preventDefault(); $("rightBtn").click(); }
  if((e.ctrlKey && e.key.toLowerCase() === "l")){ e.preventDefault(); $("leftBtn").click(); }
  if(e.key === "Escape"){
    if(pathN.size){ pathN = new Set(); pathE = new Set(); draw(); return; }
    if(selected){ selected = null; draw(); }
  }
  if(e.key === "Delete" && selected && document.activeElement === document.body){
    dialog("text", "删除这个实体？", "相连的关系会一起删除。", "输入 yes 确认", "", v => {
      if((v||"").trim().toLowerCase() !== "yes") return;
      const d = data();
      d.nodes = d.nodes.filter(x => x.id !== selected);
      d.edges = d.edges.filter(x => x.from !== selected && x.to !== selected);
      selected = null; save(); draw();
    });
  }
});

/* ═══════════════ 导入导出 ═══════════════ */
let fileCb = null;
function pick(cb){ fileCb = cb; $("filePick").value = ""; $("filePick").click(); }
$("filePick").onchange = () => {
  const f = $("filePick").files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ fileCb && fileCb(JSON.parse(r.result)); }catch(e){ toast("文件不是合法 JSON"); } };
  r.readAsText(f);
};
function download(name, text, mime){
  const b = new Blob([text], { type:mime || "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function exportJson(){
  download(`guangxiw-${(data().name||"folder").replace(/[\\/:*?"<>|]/g,"_")}-${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify({ folders, cur:curId, v:VERSION }, null, 2));
  toast("已导出 JSON");
}
function exportMd(){
  const d = data(), deg = {};
  d.edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
  const L = [`# ${d.name} · 关系网梳理`, "", `导出：${fmt(now())}`, "",
    `实体 ${d.nodes.length} 个 · 关系 ${d.edges.length} 条`, "", "## 实体", "",
    "| 名称 | 类型 | 标签 | 关系数 | 账号 | 记录 |", "|---|---|---|---|---|---|"];
  [...d.nodes].sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0)).forEach(n => {
    L.push(`| ${n.name} | ${TYPE_LABEL[n.type]||n.type} | ${(n.tags||[]).join("、")||"—"} | ${deg[n.id]||0} | ${(n.accounts||[]).length} | ${(n.events||[]).length} |`);
  });
  L.push("", "## 关系", "", "| A | 关系 | B | 强度 | 证据 | 备注 |", "|---|---|---|---|---|---|");
  d.edges.forEach(e => {
    const a = d.nodes.find(x=>x.id===e.from), b = d.nodes.find(x=>x.id===e.to);
    L.push(`| ${a?a.name:"?"} | ${e.type} | ${b?b.name:"?"} | ${e.strength||3} | ${e.evidence||"—"} | ${(e.note||"—").replace(/\|/g,"/")} |`);
  });
  L.push("", "## 逐人档案", "");
  d.nodes.forEach(n => {
    const rels = d.edges.filter(e => e.from===n.id || e.to===n.id);
    L.push(`### ${n.name}（${TYPE_LABEL[n.type]||n.type}）`);
    if((n.accounts||[]).length) L.push(`- 账号：${n.accounts.map(a=>`${a.platform} ${a.handle}`).join("；")}`);
    (n.attrs||[]).forEach(a => L.push(`- ${a.k}：${a.v}`));
    rels.forEach(e => {
      const o = d.nodes.find(x => x.id === (e.from===n.id?e.to:e.from));
      L.push(`- 关系：${o?o.name:"?"}（${e.type}，强度 ${e.strength||3}${e.evidence?"，证据 "+e.evidence:""}）`);
    });
    (n.events||[]).slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach(ev => L.push(`- 记录 ${fmt(ev.at)} ${ev.text}`));
    L.push("");
  });
  download(`guangxiw-${(d.name||"folder").replace(/[\\/:*?"<>|]/g,"_")}.md`, L.join("\n"), "text/markdown");
  toast("已导出 Markdown");
}
function exportSj(){
  const d = data(), persons = [];
  d.nodes.filter(n => n.type === "person").forEach(n => {
    const rels = [];
    d.edges.forEach(e => {
      const oid = e.from === n.id ? e.to : (e.to === n.id ? e.from : null);
      if(!oid) return;
      const o = d.nodes.find(x => x.id === oid); if(!o) return;
      rels.push({ to:o.name, toType:TYPE_LABEL[o.type]||o.type, type:e.type, strength:e.strength||3,
        evidence:e.evidence||"", note:e.note||"" });
    });
    if(rels.length) persons.push({ name:n.name, accounts:n.accounts||[], attrs:n.attrs||[], relations:rels });
  });
  if(!persons.length) return toast("还没有可导出的关系");
  download(`guangxiw-relations-${(d.name||"folder").replace(/[\\/:*?"<>|]/g,"_")}.json`,
    JSON.stringify({ kind:"guangxiw.relations", version:2, folder:d.name, generatedAt:now(), persons }, null, 2));
  toast(`已导出 ${persons.length} 人的关系摘要`);
}
function importOwn(obj){
  if(!obj) return toast("空文件");
  if(Array.isArray(obj.folders)){
    obj.folders.forEach(f => { f.id = uid("f"); folders.push(f); });
    save(); refreshFolders(); draw(); center(true);
    return toast(`已导入 ${obj.folders.length} 个文件夹`);
  }
  if(Array.isArray(obj.nodes)){
    const d = data(), map = {};
    obj.nodes.forEach(n => { const c = Object.assign({}, n); c.id = uid("n"); map[n.id] = c.id; d.nodes.push(c); });
    (obj.edges||[]).forEach(e => {
      if(map[e.from] && map[e.to]){ const c = Object.assign({}, e); c.id = uid("e"); c.from = map[e.from]; c.to = map[e.to]; d.edges.push(c); }
    });
    save(); layout("force"); draw(); center(true);
    return toast("已并入当前文件夹");
  }
  toast("不是 GuangXIW 导出文件");
}
function importSJ(obj){
  if(!obj || !Array.isArray(obj.persons)) return toast("不是 SJ Lens 导出文件");
  const d = data();
  let add = 0, upd = 0, rel = 0;
  obj.persons.forEach(p => {
    let n = d.nodes.find(x => x.name === p.name);
    if(!n){ n = mkNode(p.name, "person"); n.tags = ["SJ目标"]; d.nodes.push(n); add++; }
    else { n.tags = Array.from(new Set([...(n.tags||[]), "SJ目标"])); upd++; }
    (p.accounts||[]).forEach(acc => {
      const label = acc.label || acc.platform || "账号";
      const nm = p.name + "·" + label;
      let an = d.nodes.find(x => x.name === nm);
      if(!an){ an = mkNode(nm, "account"); an.tags = [acc.platform||""]; d.nodes.push(an); add++; }
      if(!d.edges.some(e => (e.from===n.id&&e.to===an.id)||(e.from===an.id&&e.to===n.id))){
        d.edges.push(mkEdge(n.id, an.id, "同平台", 4, "SJ Lens 账号")); rel++;
      }
    });
  });
  save(); layout("force"); draw(); center(true);
  toast(`已合并：新增 ${add} · 更新 ${upd} · 补 ${rel} 条关系`);
}

/* 最短路径 */
function shortestPath(nodes, edges, fromId, toId){
  if(!fromId || !toId) return null;
  if(fromId === toId) return { nodes:[fromId], edges:[] };
  const adj = {};
  nodes.forEach(n => { adj[n.id] = []; });
  edges.forEach(e => {
    if(adj[e.from] && adj[e.to]){
      adj[e.from].push({ to:e.to, id:e.id });
      adj[e.to].push({ to:e.from, id:e.id });
    }
  });
  const prev = {}, prevEdge = {}, seen = {};
  const q = [fromId]; seen[fromId] = true;
  while(q.length){
    const cur = q.shift();
    if(cur === toId) break;
    (adj[cur] || []).forEach(s => {
      if(seen[s.to]) return;
      seen[s.to] = true; prev[s.to] = cur; prevEdge[s.to] = s.id; q.push(s.to);
    });
  }
  if(!seen[toId]) return null;
  const cn = [toId], ce = [];
  let cur = toId;
  while(cur !== fromId){ ce.push(prevEdge[cur]); cur = prev[cur]; cn.push(cur); }
  return { nodes:cn.reverse(), edges:ce.reverse() };
}
