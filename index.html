<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuangXIW</title>
<style>
:root{
  --bg:#0f1115; --panel:#14171d; --card:#171b22; --card2:#1c2129;
  --line:#2a303a; --line2:#3a4350; --fg:#cfccc7; --muted:#8e939c; --dim:#767a83;
  --brass:#c8a96a; --brass2:#8d7748; --rust:#d0795a; --steel:#8aa2bd;
  --sans:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --titlefont:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 画布上不要出现文本选择光标：拖拽=移动节点/平移画布 */
  html,body,#canvasWrap,svg,#topbar,#side,.brand{user-select:none;-webkit-user-select:none}
  input,textarea,select{user-select:text;-webkit-user-select:text;cursor:text}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:15.5px/1.8 var(--sans);font-weight:500;letter-spacing:.004em;
  text-rendering:auto;-webkit-font-smoothing:auto}
  /* 极轻微的光晕：让笔画边缘不那么"利"，小字号下明显更柔和 */
  html,body,#topbar,#side,.card,.btn,input,select,textarea{
    text-shadow:0 0 .45px rgba(255,255,255,.18)}
#app{display:grid;grid-template-columns:214px minmax(0,1fr) 344px;height:100%;
  transition:grid-template-columns .28s cubic-bezier(.22,.61,.36,1)}
  #app.leftHidden{grid-template-columns:0px minmax(0,1fr) 344px}
  #app.sideHidden{grid-template-columns:214px minmax(0,1fr) 0px}
  #app.sideHidden.leftHidden{grid-template-columns:0px minmax(0,1fr) 0px}
#canvasWrap{position:relative;flex:1;overflow:hidden;
  background:radial-gradient(1100px 640px at 32% -8%,#161b23 0%,var(--bg) 62%)}
svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
svg.dragging{cursor:grabbing}

#topbar{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(15,17,21,.96),rgba(15,17,21,.7))}
#appIcon{flex:0 0 20px;width:20px;height:20px;border-radius:5px;display:block}
.brandWrap{display:flex;align-items:center;gap:9px;flex:none}
.brand{font-family:var(--titlefont);font-size:16px;font-weight:600;letter-spacing:.01em;
  line-height:1;color:var(--fg)}
.brand i{font-style:normal;color:var(--brass)}
.rightGroup{display:flex;gap:8px;align-items:center;margin-left:auto;flex:0 0 auto;
    transition:transform .22s ease}
  #search{flex:1 1 150px;min-width:110px;max-width:250px;background:var(--card);border:1px solid var(--line2);color:var(--fg);
  border-radius:10px;padding:9px 12px;font:13px var(--sans);outline:none;transition:.18s}
#search:focus{border-color:var(--brass2);background:var(--card2)}
.btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;background:var(--card);border:1px solid var(--line2);
  color:var(--fg);border-radius:8px;padding:8px 13px;font:13px var(--sans);cursor:pointer;
  transition:transform .12s,border-color .18s,background .18s,color .18s}
.btn:hover{border-color:var(--brass2);color:var(--brass);background:var(--card2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:rgba(200,169,106,.12);border-color:var(--brass2);color:var(--brass)}
.btn.ghost{background:transparent}
  .btn.icon{width:34px;padding:0}
  .btn.icon svg{display:block}
.btn.danger{color:var(--rust);border-color:#4a2f28}

#capture{position:absolute;left:14px;right:96px;bottom:14px;display:flex;gap:10px;align-items:center;
  background:rgba(23,27,34,.95);border:1px solid var(--line2);border-radius:10px;padding:9px 12px}
#capture input{flex:1;background:transparent;border:0;color:var(--fg);font:13.5px var(--sans);outline:none}
#capture input::placeholder{color:var(--dim)}

#leftPane{border-right:1px solid var(--line);background:var(--panel);display:flex;
  flex-direction:column;overflow:hidden;min-width:0}
#leftPane .ph{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);
  font-size:11px;color:var(--muted);letter-spacing:.12em}
#leftPane .ph b{margin-left:auto;font-weight:500;color:var(--dim);letter-spacing:0}
#typeFilters{display:flex;flex-wrap:wrap;gap:5px;padding:10px 11px 4px}
#entityList{flex:1;overflow:auto;padding:4px 8px 16px}
.erow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;
  transition:.14s;font-size:13.5px}
.erow:hover{background:#1b2028}
.erow.sel{background:rgba(200,169,106,.13)}
.erow .dt{width:7px;height:7px;border-radius:50%;flex:none}
.erow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .dg{font-size:11px;color:var(--rust);flex:none}
#side{width:auto;min-width:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;transition:opacity .22s,border-color .3s}
#app.sideHidden #side{opacity:0;border-left-color:transparent}
#side header{padding:12px 16px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);
  letter-spacing:.1em;text-transform:uppercase}
#panel{flex:1;overflow:auto;padding:16px;min-width:320px}
  #side>header{min-width:320px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.row label{width:56px;flex:none;font-size:11px;color:var(--dim);letter-spacing:.06em}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line2);color:var(--fg);
  border-radius:7px;padding:8px 10px;font:13px var(--sans);outline:none;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:var(--brass2);background:var(--card2)}
textarea{resize:vertical;min-height:66px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer;transition:.16s}
.chip.on{border-color:var(--brass);color:var(--brass);background:rgba(200,169,106,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:12px}
.card h4{margin:0 0 11px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.13em;
  display:flex;justify-content:space-between}
.kv{font-size:12px;color:var(--dim);line-height:1.9}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:8px 6px;border-radius:7px;cursor:pointer;font-size:13px;transition:.15s}
.list-item:hover{background:var(--card2);color:var(--brass)}
.deg{color:var(--rust);font-size:11.5px}
.sep{height:1px;background:var(--line);margin:14px 0}
.empty{color:var(--dim);font-size:12.5px;line-height:1.9}

.overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,13,.72)}
.overlay.on{display:flex;animation:ov .16s ease-out}
@keyframes ov{from{opacity:0}to{opacity:1}}
.modal{width:min(440px,90vw);background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:mp .18s ease-out}
@keyframes mp{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 6px;font-family:var(--serif);font-size:17px;font-weight:600}
.modal p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);z-index:30;
  background:rgba(23,27,34,.98);border:1px solid var(--brass2);border-radius:9px;padding:9px 15px;
  font-size:12.5px;opacity:0;transition:.22s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){
    #app{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr 46%}
    #app.sideHidden{grid-template-rows:1fr 0px}
    #side{width:100%;border-left:0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="leftPane">
    <div class="ph">实体 <b id="countLbl"></b>
      <select id="layoutSel" style="width:96px;height:24px;font-size:11.5px;padding:0 6px;margin-left:6px">
        <option value="force">力导向</option><option value="circle">环形</option><option value="degree">按连接数</option>
      </select></div>
    <div id="typeFilters"></div>
    <div id="entityList"></div>
  </aside>
  <div id="canvasWrap">
    <svg id="svg"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="topbar">
      <div class="brandWrap">
      <svg id="appIcon" width="20" height="20" viewBox="0 0 256 256" aria-hidden="true">
        <defs>
          <linearGradient id="icGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3f63e0"/><stop offset="1" stop-color="#9a6bff"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#icGrad)"/>
        <g stroke="#ffffff" stroke-width="10" stroke-opacity=".92">
          <line x1="88" y1="88" x2="170" y2="120"/>
          <line x1="88" y1="88" x2="110" y2="178"/>
          <line x1="170" y1="120" x2="110" y2="178"/>
        </g>
        <g fill="#ffffff">
          <circle cx="88" cy="88" r="17"/><circle cx="170" cy="120" r="17"/><circle cx="110" cy="178" r="17"/>
        </g>
      </svg>
      <div class="brand">Guang<i>XIW</i></div>
      </div>
      <select id="caseSel" style="width:150px"></select>
      <button class="btn" id="caseAdd">+ 文件夹</button>
      <input id="search" placeholder="搜索人名 / 标签">
      <div class="rightGroup">
      <button class="btn icon" id="exportBtn" title="导出 JSON"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg></button>
      <button class="btn icon" id="importBtn" title="导入 JSON"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M5 19h14"/></svg></button>
      <button class="btn primary" id="fitBtn">整理</button>
      <button class="btn ghost" id="toggleLeft" title="实体列表">实体</button>
      <button class="btn ghost" id="toggleSide" title="收起/展开右侧面板(Ctrl+B)">面板</button>
      </div>
    </div>
    <div id="capture">
      <input id="capInput" placeholder="速记：选中某人就补进备注，没选就新建一条（回车）">
      <button class="btn primary" id="capBtn">记一笔</button>
      <button class="btn" id="addNode" title="新增人物">+ 人物</button>
    </div>
    <div class="overlay" id="overlay">
      <div class="modal">
        <h3 id="mTitle"></h3>
        <p id="mDesc"></p>
        <input id="mInput">
        <div class="actions">
          <button class="btn" id="mCancel">取消</button>
          <button class="btn primary" id="mOk">确定</button>
        </div>
      </div>
    </div>
    <div class="overlay" id="cropOverlay">
      <div class="modal" style="width:min(400px,92vw)">
        <h3>裁切头像</h3>
        <p>拖动图片调整位置，滑块缩放；方框内的部分会保存成头像。</p>
        <div id="cropStage" style="position:relative;width:240px;height:240px;margin:0 auto;
             overflow:hidden;background:#0b0d11;border:1px solid var(--line2);border-radius:10px;cursor:grab">
          <img id="cropImg" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none">
          <div style="position:absolute;inset:0;pointer-events:none;border:9999px solid rgba(0,0,0,.45)"></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
          <span class="kv">缩放</span>
          <input type="range" id="cropZoom" min="1" max="4" step="0.05" value="1" style="padding:0">
        </div>
        <div class="actions">
          <button class="btn" id="cropCancel">取消</button>
          <button class="btn primary" id="cropOk">使用这张</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
  </div>
  <div id="side"><header id="sideHeader">未选中 · 点图上的卡片</header><div id="panel"></div></div>
</div>
<script>
const TYPES=[["person","人物"],["org","组织"],["place","地点"],["account","账号"],["other","其他"]];
const TYPE_LABEL=Object.fromEntries(TYPES);
const TYPE_COLOR={person:"#c8a96a",org:"#8aa2bd",place:"#c9a06a",account:"#8fa3b8",other:"#8d919b"};
const typeColor=t=>TYPE_COLOR[t]||"#9aa6b8";
const typeLabel=t=>TYPE_LABEL[t]||t||"其他";
const RELS=["亲属","同事","同学","好友","资金","同平台","其他"];
const KEY="guangxiw.v1";
const APP_VERSION="1.0.0";
let state={nodes:[],edges:[]},selectedId=null,view={x:0,y:0,k:1},drag=null,panning=null;
const svg=document.getElementById("svg"),gN=document.getElementById("nodes"),
      gE=document.getElementById("edges"),gV=document.getElementById("viewport");
const NW=152,NH=58;
const uid=p=>p+Math.random().toString(36).slice(2,8);
const mkNode=(name,type,tags)=>({id:uid("n"),name,type:type||"person",tags:tags||[],note:"",x:0,y:0,avatar:""});
const mkEdge=(from,to,type,s,note,ev)=>({id:uid("e"),from,to,type:type||"其他",strength:s||3,note:note||"",evidence:ev||""});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 多案例（文件夹）：一个案例 = 一份独立的关系网，像 SJ Lens 的文件夹 */
let cases=[], curId=null;
function blankCase(name){
  const a=mkNode("张三"), b=mkNode("李四"), c=mkNode("某科技公司","org");
  return {id:uid("c"), name:name||"未命名案例", nodes:[a,b,c],
    edges:[mkEdge(a.id,b.id,"同学",3,"高中同桌"), mkEdge(a.id,c.id,"同事",5,"同公司")]};
}
function currentCase(){ return cases.find(c=>c.id===curId) || cases[0]; }
function syncState(){ const c=currentCase(); state.nodes=c.nodes; state.edges=c.edges; }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({cases, cur:curId})); }
  catch(e){ toast("存储失败：头像太多，建议少放几张"); }
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(Array.isArray(d.cases)&&d.cases.length){ cases=d.cases; curId=d.cur||cases[0].id; }
      else if(Array.isArray(d.nodes)){ // 老数据：迁移成一个案例
        cases=[{id:uid("c"),name:"默认文件夹",nodes:d.nodes,edges:d.edges||[]}]; curId=cases[0].id;
      }
    }
  }catch(e){}
  if(!cases.length){ const c=blankCase("默认文件夹"); cases=[c]; curId=c.id; }
  syncState();
  const sel=document.getElementById("caseSel");
  sel.innerHTML=cases.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  sel.value=curId;
  sel.onchange=()=>{ curId=sel.value; syncState(); selectedId=null; layout(200); save(); render(); };
}
function addCase(){
  uiPrompt("新建文件夹","一个文件夹装一个调查目标（某公司 / 某医院）。","文件夹名","",name=>{
    if(!name) return;
    const c=blankCase(name.trim()); cases.push(c); curId=c.id; syncState();
    const sel=document.getElementById("caseSel");
    sel.innerHTML=cases.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
    sel.value=curId; selectedId=null; layout(200); save(); render(); toast("已新建文件夹 "+name);
  });
}
function renameCase(){
  const c=currentCase();
  uiPrompt("重命名文件夹","",  "文件夹名", c.name, name=>{
    if(!name) return; c.name=name.trim(); save(); load(); render(); toast("已重命名");
  });
}
function deleteCase(){
  const c=currentCase();
  if(cases.length<=1) return toast("至少保留一个文件夹");
  uiConfirm("删除文件夹？",`「${c.name}」里 ${c.nodes.length} 个节点会一起删除，无法撤销。`,()=>{
    cases=cases.filter(x=>x.id!==c.id); curId=cases[0].id; syncState();
    const sel=document.getElementById("caseSel");
    sel.innerHTML=cases.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
    sel.value=curId; selectedId=null; layout(200); save(); render(); toast("已删除文件夹");
  });
}
document.getElementById("caseAdd").onclick=addCase;

/* 右侧面板收起 / 展开，状态记在本机 */
function applySide(){
  // 每次启动都从「展开」开始，避免打开后一脸懵
  const hidden = window.__sideHidden === true;
  document.getElementById("app").classList.toggle("sideHidden", hidden);
  const b = document.getElementById("toggleSide");
  if(b) b.textContent = hidden ? "展开面板" : "收起面板";
}
function toggleSide(){
  const hidden = window.__sideHidden === true;
  window.__sideHidden = !hidden;
  applySide();
  setTimeout(fitView, 330);   // 等宽度过渡结束再居中
}
document.getElementById("toggleSide").onclick = toggleSide;
window.__sideHidden = false;
document.addEventListener("keydown", e=>{
  if((e.ctrlKey && e.key.toLowerCase() === "b") || e.key === "F2"){ e.preventDefault(); toggleSide(); }
});

/* 自绘对话框 */
let modalCb=null;
function openModal(mode,title,desc,ph,def,cb){modalCb=cb;
  document.getElementById("mTitle").textContent=title;
  document.getElementById("mDesc").textContent=desc||"";
  const i=document.getElementById("mInput");
  i.style.display=mode==="prompt"?"block":"none";i.value=def||"";i.placeholder=ph||"";
  document.getElementById("overlay").classList.add("on");
  if(mode==="prompt")setTimeout(()=>i.focus(),60);}
function closeModal(){document.getElementById("overlay").classList.remove("on");modalCb=null;}
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("mOk").onclick=()=>{const v=document.getElementById("mInput").value.trim();const cb=modalCb;closeModal();if(cb)cb(v);};
document.getElementById("mInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("mOk").click();});
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
const uiPrompt=(t,d,p,v,cb)=>openModal("prompt",t,d,p,v,cb);
const uiConfirm=(t,d,cb)=>openModal("confirm",t,d,"","",()=>cb());
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("on");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),3000);}

/* 力导向 */
function layout(iter){
  const N=state.nodes,E=state.edges;if(!N.length)return;
  const W=svg.clientWidth||900,H=svg.clientHeight||620;
  // 初始摆位：没有坐标、或多人挤在同一点（0,0）时，按圆周铺开，避免斥力算出 NaN
  const key = n => Math.round(n.x/6) + "," + Math.round(n.y/6);
  const buckets = {};
  N.forEach(n=>{ (buckets[key(n)] = buckets[key(n)]||[]).push(n); });
  N.forEach((n,i)=>{
    const bad = typeof n.x !== "number" || isNaN(n.x) || buckets[key(n)].length > 1;
    if(bad){
      const a = i / N.length * Math.PI * 2;
      const r = Math.max(150, Math.min(W,H) * .3);
      n.x = Math.cos(a) * r;
      n.y = Math.sin(a) * r;
    }
  });
  const by=Object.fromEntries(N.map(n=>[n.id,n]));
  for(let s=0;s<iter;s++){
    const f={};N.forEach(n=>f[n.id]={x:0,y:0});
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      const a=N[i],b=N[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);
      const rp=62000/d2,ux=dx/d,uy=dy/d;
      f[a.id].x-=ux*rp;f[a.id].y-=uy*rp;f[b.id].x+=ux*rp;f[b.id].y+=uy*rp;}
    E.forEach(e=>{const a=by[e.from],b=by[e.to];if(!a||!b)return;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const rest=235-(e.strength||3)*14,k=.010*(1+(e.strength||3)/6),p=(d-rest)*k,ux=dx/d,uy=dy/d;
      f[a.id].x+=ux*p;f[a.id].y+=uy*p;f[b.id].x-=ux*p;f[b.id].y-=uy*p;});
    N.forEach(n=>{f[n.id].x-=n.x*.005;f[n.id].y-=n.y*.005;});
    N.forEach(n=>{if(drag&&drag.id===n.id)return;
      n.x+=Math.max(-46,Math.min(46,f[n.id].x));n.y+=Math.max(-46,Math.min(46,f[n.id].y));});
  }
}

/* 渲染 */
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const deg={};state.edges.forEach(e=>{deg[e.from]=(deg[e.from]||0)+1;deg[e.to]=(deg[e.to]||0)+1;});
  const by=Object.fromEntries(state.nodes.map(n=>[n.id,n]));
  gE.innerHTML=state.edges.map(e=>{const a=by[e.from],b=by[e.to];if(!a||!b)return"";
    const act=selectedId&&(e.from===selectedId||e.to===selectedId);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${act?"#c8a96a":"#39424f"}"
      stroke-width="${1.1+(e.strength||3)*.55}" stroke-linecap="round">
      <title>${esc(a.name)} — ${esc(e.type)} — ${esc(b.name)}｜强度 ${e.strength||3}</title></line>`;}).join("");
  gN.innerHTML=state.nodes.map(n=>{
    const hit=q&&(n.name.toLowerCase().includes(q)||(n.tags||[]).join(",").toLowerCase().includes(q));
    const sel=n.id===selectedId,color=TYPE_COLOR[n.type]||TYPE_COLOR.other;
    const x=n.x-NW/2,y=n.y-NH/2;
    const av=n.avatar
      ?`<image href="${n.avatar}" x="${x+10}" y="${y+11}" width="36" height="36" clip-path="inset(0 round 9px)"/>`
      :`<defs><radialGradient id="av${n.id}" cx="32%" cy="26%" r="78%">
           <stop offset="0" stop-color="${color}" stop-opacity=".55"/>
           <stop offset="1" stop-color="${color}" stop-opacity=".22"/>
         </radialGradient></defs>
        <circle cx="${x+28}" cy="${y+29}" r="19" fill="url(#av${n.id})" stroke="${color}" stroke-opacity=".35"/>
        <text x="${x+28}" y="${y+29}" text-anchor="middle" dominant-baseline="central"
           font-size="16" font-weight="500" fill="#0f1115" fill-opacity=".82"
           font-family="Noto Sans SC, Microsoft YaHei UI, Segoe UI, sans-serif">${esc((n.name||"?").slice(0,1))}</text>`;
    return `<g class="node" data-id="${n.id}" style="cursor:pointer">
      ${hit?`<rect x="${x-3}" y="${y-3}" width="${NW+6}" height="${NH+6}" rx="15" fill="none" stroke="#d0795a" stroke-width="1.4"/>`:""}
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="13" fill="${sel?"#1e232b":"#171b22"}"
        stroke="${sel?color:"#2c333d"}" stroke-width="${sel?1.8:1}"/>
      ${av}
      <text x="${x+56}" y="${y+28}" font-size="13.5" fill="#dcd9d3"
        font-family="Microsoft YaHei UI, Microsoft YaHei, Segoe UI, sans-serif">${esc(n.name.slice(0,7))}</text>
      <text x="${x+56}" y="${y+45}" font-size="10.5" fill="#8b9099"
        font-family="Microsoft YaHei UI, Microsoft YaHei, Segoe UI, sans-serif">${typeLabel(n.type)}${deg[n.id]?" · "+deg[n.id]:""}</text>
    </g>`;}).join("");
  applyView();
  renderPanel();
  renderEntityList();
}

/* 头像：先裁切再入库（可拖动 + 缩放） */
let avatarTarget=null;
const avatarInput=document.getElementById("avatarInput");
const cropOverlay=document.getElementById("cropOverlay");
const cropImg=document.getElementById("cropImg");
const cropZoom=document.getElementById("cropZoom");
const STAGE=240;
let crop={img:null,scale:1,ox:0,oy:0,drag:null};

avatarInput.onchange=()=>{
  const f=avatarInput.files[0];if(!f||!avatarTarget)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      crop.img=im;crop.scale=1;
      const k=Math.max(STAGE/im.width,STAGE/im.height);
      crop.baseK=k;
      crop.ox=(STAGE-im.width*k)/2; crop.oy=(STAGE-im.height*k)/2;
      drawCrop(); cropOverlay.classList.add("on");
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
};
function drawCrop(){
  if(!crop.img)return;
  const k=crop.baseK*crop.scale;
  cropImg.src=crop.img.src;
  cropImg.style.width=(crop.img.width*k)+"px";
  cropImg.style.height=(crop.img.height*k)+"px";
  cropImg.style.left=crop.ox+"px";
  cropImg.style.top=crop.oy+"px";
}
cropZoom.oninput=()=>{
  const old=crop.scale;crop.scale=parseFloat(cropZoom.value);
  const cx=STAGE/2,cy=STAGE/2;
  crop.ox=cx-(cx-crop.ox)*(crop.scale/old);
  crop.oy=cy-(cy-crop.oy)*(crop.scale/old);
  drawCrop();
};
document.getElementById("cropStage").addEventListener("pointerdown",e=>{
  e.preventDefault();crop.drag={x:e.clientX,y:e.clientY,ox:crop.ox,oy:crop.oy};
  e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
});
document.getElementById("cropStage").addEventListener("pointermove",e=>{
  if(!crop.drag)return;
  crop.ox=crop.drag.ox+(e.clientX-crop.drag.x);
  crop.oy=crop.drag.oy+(e.clientY-crop.drag.y);
  drawCrop();
});
document.getElementById("cropStage").addEventListener("pointerup",()=>{crop.drag=null;});
document.getElementById("cropCancel").onclick=()=>{cropOverlay.classList.remove("on");crop.img=null;};
document.getElementById("cropOk").onclick=()=>{
  if(!crop.img)return;
  const size=96,r=size/STAGE;
  const c=document.createElement("canvas");c.width=size;c.height=size;
  const ctx=c.getContext("2d");
  ctx.drawImage(crop.img,crop.ox*r,crop.oy*r,crop.img.width*crop.baseK*crop.scale*r,
                crop.img.height*crop.baseK*crop.scale*r,0,0,size,size);
  const node=state.nodes.find(n=>n.id===avatarTarget);
  if(node){node.avatar=c.toDataURL("image/jpeg",.85);save();render();toast("头像已更新");}
  cropOverlay.classList.remove("on");crop.img=null;
};

/* 画布交互 */
const vw=()=>(svg.clientWidth||900)/2, vh=()=>(svg.clientHeight||620)/2;
const applyView=()=>gV.setAttribute("transform",`translate(${view.x+vw()},${view.y+vh()}) scale(${view.k})`);
const toWorld=(cx,cy)=>{const r=svg.getBoundingClientRect();
  return{x:(cx-r.left-view.x-vw())/view.k,y:(cy-r.top-view.y-vh())/view.k};};
svg.addEventListener("pointerdown",ev=>{
  ev.preventDefault();          // 阻止浏览器把拖拽当成文字选择
  window.getSelection && window.getSelection().removeAllRanges();
  const el=ev.target.closest(".node");
  if(el){const n=state.nodes.find(x=>x.id===el.dataset.id),p=toWorld(ev.clientX,ev.clientY);
    drag={id:n.id,dx:p.x-n.x,dy:p.y-n.y};selectedId=n.id;render();svg.setPointerCapture(ev.pointerId);return;}
  if(selectedId){ selectedId=null; render(); }   // 点空白 = 取消选中
  panning={sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y};svg.classList.add("dragging");
  svg.setPointerCapture(ev.pointerId);});
svg.addEventListener("pointermove",ev=>{
  if(drag){const n=state.nodes.find(x=>x.id===drag.id);if(!n)return;
    const p=toWorld(ev.clientX,ev.clientY);n.x=p.x-drag.dx;n.y=p.y-drag.dy;render();}
  else if(panning){view.x=panning.vx+(ev.clientX-panning.sx);view.y=panning.vy+(ev.clientY-panning.sy);
    applyView();}});
svg.addEventListener("pointerup",()=>{if(drag)save();drag=null;panning=null;svg.classList.remove("dragging");});
svg.addEventListener("dblclick",ev=>{
  ev.preventDefault();
  if(ev.target.closest(".node"))return;
  uiPrompt("新增人物","输入名字，回车加入。","名字","",name=>{
    if(!name)return;const p=toWorld(ev.clientX,ev.clientY),n=mkNode(name.trim());
    n.x=p.x;n.y=p.y;state.nodes.push(n);selectedId=n.id;save();render();toast("已添加 "+name);});});
svg.addEventListener("wheel",ev=>{ev.preventDefault();
  const b=toWorld(ev.clientX,ev.clientY);
  view.k=Math.min(2.4,Math.max(.35,view.k*(ev.deltaY>0?.92:1.08)));
  const a=toWorld(ev.clientX,ev.clientY);
  view.x+=(a.x-b.x)*view.k;view.y+=(a.y-b.y)*view.k;
  applyView();},{passive:false});

/* 顶栏 */
document.getElementById("addNode").onclick=()=>uiPrompt("新增人物","输入名字，回车加入。","名字","",name=>{
  if(!name)return;const n=mkNode(name.trim());state.nodes.push(n);selectedId=n.id;
  layout(90);save();render();toast("已添加 "+name);});
/* 整理：最简算法 —— 只把内容挪到画布正中，缩放与布局都不动 */
function fitView(){
  const N = state.nodes;
  if(!N.length){ view = {x:0, y:0, k:1}; applyView(); return; }
  let x1=Infinity, y1=Infinity, x2=-Infinity, y2=-Infinity;
  N.forEach(n=>{
    x1=Math.min(x1,n.x); x2=Math.max(x2,n.x);
    y1=Math.min(y1,n.y); y2=Math.max(y2,n.y);
  });
  view.x = -((x1+x2)/2);
  view.y = -((y1+y2)/2);
  applyView();
}
document.getElementById("fitBtn").onclick=()=>{
  const vp = document.getElementById("viewport");
  vp.style.transition = "transform .22s ease-out";
  fitView();
  setTimeout(()=>{ vp.style.transition = ""; }, 260);
};
document.getElementById("search").oninput=render;
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  const cname=(currentCase().name||"case").replace(/[\\/:*?"<>|]/g,"_");
  a.download="guangxiw-"+cname+"-"+new Date().toISOString().slice(0,10)+".json";a.click();
  URL.revokeObjectURL(a.href);toast("已导出 JSON");};
const fileInput=document.getElementById("fileInput");
let fileHandler=null;
document.getElementById("importBtn").onclick=()=>{fileHandler=importOwn;fileInput.value="";fileInput.click();};
fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{fileHandler&&fileHandler(JSON.parse(r.result));}
  catch(e){toast("不是合法 JSON");}};r.readAsText(f);};
function importOwn(d){
  if(!d||!Array.isArray(d.nodes)&&!Array.isArray(d.cases))return toast("不是 GuangXIW 导出文件");
  if(Array.isArray(d.cases)){ // 整包导入：全部并入案例列表
    uiConfirm("导入全部案例？",`将新增 ${d.cases.length} 个文件夹，与现有文件夹并存。`,()=>{
      d.cases.forEach(c=>{ c.id=uid("c"); cases.push(c); });
      save(); load(); render(); toast("已导入文件夹");
    });
    return;
  }
  uiConfirm("并入当前文件夹？",`把 ${d.nodes.length} 个节点 / ${(d.edges||[]).length} 条关系并进「${currentCase().name}」。`,()=>{
    const c=currentCase();
    const map={};
    d.nodes.forEach(n=>{ const copy=Object.assign({},n); copy.id=uid("n"); map[n.id]=copy.id; c.nodes.push(copy); });
    (d.edges||[]).forEach(e=>{ if(map[e.from]&&map[e.to]){
      const copy=Object.assign({},e); copy.id=uid("e"); copy.from=map[e.from]; copy.to=map[e.to]; c.edges.push(copy); } });
    syncState(); selectedId=null; save(); layout(170); render(); toast("已并入当前文件夹");
  });
}

/* 合并导入 SJ Lens */
function importSJ(d){
  if(!d||!Array.isArray(d.persons))return toast("不是 SJ Lens 导出文件");
  let add=0,upd=0,rel=0;const now=Date.now();
  d.persons.forEach(p=>{
    let n=state.nodes.find(x=>x.name===p.name);
    if(!n){n=mkNode(p.name,"person",["SJ目标"]);state.nodes.push(n);add++;}
    else{n.tags=Array.from(new Set([...(n.tags||[]),"SJ目标"]));upd++;}
    n.sjId=p.id;n.sjSyncAt=now;
    (p.accounts||[]).forEach(acc=>{
      const label=acc.label||acc.platform||"账号",name=p.name+"·"+label;
      let an=state.nodes.find(x=>x.name===name);
      if(!an){an=mkNode(name,"account",[acc.platform||""]);state.nodes.push(an);add++;}
      an.sjId=p.id+"-"+(acc.id||label);an.sjSyncAt=now;
      if(!state.edges.some(e=>(e.from===n.id&&e.to===an.id)||(e.from===an.id&&e.to===n.id))){
        state.edges.push(mkEdge(n.id,an.id,"同平台",4,"SJ Lens 账号"));rel++;}});});
  save();layout(170);render();toast(`已合并：新增 ${add} / 更新 ${upd}，补 ${rel} 条关系`);}

/* 速记 */
function quickCapture(){
  const inp=document.getElementById("capInput"),text=inp.value.trim();if(!text)return;
  const d=new Date(),stamp=`${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} `
    +`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const node=state.nodes.find(n=>n.id===selectedId);
  if(node){node.note=(node.note?node.note+"\n":"")+`[${stamp}] ${text}`;toast("已写入 "+node.name+" 的备注");}
  else{const n=mkNode(text.slice(0,18),"other",["速记"]);n.note=`[${stamp}] ${text}`;
    state.nodes.push(n);selectedId=n.id;toast("已新建速记节点");}
  inp.value="";save();layout(70);render();}
document.getElementById("capBtn").onclick=quickCapture;
document.getElementById("capInput").addEventListener("keydown",e=>{if(e.key==="Enter")quickCapture();});

/* ---------- 左栏实体表 / 布局预设 ---------- */
let filterType = null;
function layoutPreset(kind){
  const N = state.nodes, E = state.edges;
  if(!N.length) return;
  if(kind === "circle"){
    const R = Math.max(190, N.length * 24);
    N.forEach((n,i)=>{ const a = i/N.length*Math.PI*2 - Math.PI/2;
      n.x = Math.cos(a)*R; n.y = Math.sin(a)*R; });
    return;
  }
  if(kind === "degree"){
    const deg = {}; E.forEach(e=>{ deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
    const arr = [...N].sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0));
    const cols = Math.max(1, Math.ceil(Math.sqrt(arr.length)));
    arr.forEach((n,i)=>{ n.x = (i%cols)*250 - (cols-1)*125; n.y = Math.floor(i/cols)*140; });
    return;
  }
  layout(260);
}
function renderEntityList(){
  const box = document.getElementById("entityList");
  if(!box) return;
  const deg = {}; state.edges.forEach(e=>{ deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });
  const q = (document.getElementById("search").value || "").trim().toLowerCase();
  const list = state.nodes.filter(n=>{
    if(filterType && n.type !== filterType) return false;
    if(!q) return true;
    return n.name.toLowerCase().includes(q) || (n.tags||[]).join(",").toLowerCase().includes(q);
  }).sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0));
  document.getElementById("countLbl").textContent = list.length + "/" + state.nodes.length;
  if(!list.length){ box.innerHTML = '<div style="font-size:12.5px;color:#6f747e;padding:12px">没有匹配的实体</div>'; return; }
  box.innerHTML = list.map(n=>
    '<div class="erow' + (selectedId===n.id?" sel":"") + '" data-jump="' + n.id + '">' +
      '<span class="dt" style="background:' + typeColor(n.type) + '"></span>' +
      '<span class="nm">' + esc(n.name) + '</span>' +
      '<span class="dg">' + (deg[n.id]||0) + '</span></div>').join("");
  box.querySelectorAll("[data-jump]").forEach(el=>{
    el.onclick = ()=>{
      selectedId = el.dataset.jump;
      const n = state.nodes.find(x=>x.id===selectedId);
      if(n){ view.x = -n.x*view.k; view.y = -n.y*view.k; applyView(); }
      render();
    };
  });
}
function buildTypeFilters(){
  const box = document.getElementById("typeFilters");
  if(!box) return;
  box.innerHTML = '<span class="chip' + (filterType===null?" on":"") + '" data-t="">全部</span>' +
    TYPES.map(([v,l])=>'<span class="chip' + (filterType===v?" on":"") + '" data-t="' + v + '">' + l + '</span>').join("");
  box.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
    filterType = el.dataset.t || null;
    buildTypeFilters(); render();
  });
}
document.getElementById("layoutSel").onchange = ()=>{
  layoutPreset(document.getElementById("layoutSel").value); render(); fitView(true);
};
document.getElementById("toggleLeft").onclick = ()=>{
  document.getElementById("app").classList.toggle("leftHidden");
  setTimeout(()=>fitView(false), 260);
};

load();layout(220);buildTypeFilters();render();applySide();
let rzT=null;
window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(fitView,180); });
</script>
