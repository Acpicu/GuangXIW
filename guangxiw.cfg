# GuangXIW 数据目录配置
# 想自己定数据放哪儿，就取消下面这行注释并改成你的路径（支持 %USERPROFILE% 这类变量）
# dataDir=D:\GuangXIW-data
#
# 三种指定方式，优先级从高到低：
# 1) 环境变量 GUANGXIW_DATA
# 2) 本文件里的 dataDir=
# 3) exe 同目录放一个空文件 guangxiw.portable（便携模式，数据放 exe 旁边 GuangXIW-data）
#
# 什么都不写：程序优先用 exe 旁边的 GuangXIW-data；exe 所在目录不可写时，
# 才退回 %LOCALAPPDATA%\GuangXIW。老版本存在那里的数据会自动搬过来，不丢。